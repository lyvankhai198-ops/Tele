name: VPS CPU RAM and disk snapshot (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: telecampaign-vps-operations
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read project CPU, RAM and disk counters
        env:
          SSHPASS: ${{ secrets.TELECAMPAIGN_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          known="$(mktemp)"
          trap 'rm -f "$known"' EXIT
          ssh-keyscan -T 10 -t ed25519 15.235.142.30 > "$known" 2>/dev/null
          test "$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}')" = "SHA256:uMPDdpYzaBv+JdI9CSedvoRegH/XJVyucdN8mt7hZtM"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=15 ubuntu@15.235.142.30 'bash -s' <<'REMOTE'
          set -euo pipefail
          test "$(hostname)" = vps-cd243267
          cd /opt/telecampaign
          set -a
          source /etc/telecampaign/api.env
          set +a
          node --input-type=module <<'NODE'
          // Read-only aggregate audit. No user IDs, chat IDs, payment details or secrets emitted.
          import { createRequire } from "node:module";
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          const require = createRequire(new URL("file:///opt/telecampaign/lib/db/package.json"));
          const { Client } = require("pg");
          const client = new Client({ connectionString: process.env.DATABASE_URL, connectionTimeoutMillis: 8000 });
          try {
            await client.connect();
            await client.query("BEGIN READ ONLY");
            await client.query("SET LOCAL statement_timeout='5s'");
            const settings = await client.query("SELECT value FROM system_settings WHERE key=$1", ["admin_system_settings"]);
            const chatId = JSON.parse(settings.rows[0]?.value ?? "{}").supportChat?.adminTelegramChatId;
            const orders = await client.query("SELECT status,count(*)::int AS count FROM purchase_orders GROUP BY status");
            const refs = await client.query("SELECT count(*)::int AS count FROM system_settings WHERE key LIKE $1", ["purchase_review_message:%"]);
            const account = chatId ? await client.query(
              `SELECT count(*)::int AS count FROM telegram_accounts a JOIN app_users u ON u.id::text=a.owner_user_id
               WHERE a.telegram_user_id=$1 AND a.deleted_at IS NULL AND a.status='connected'
                 AND a.session_encrypted IS NOT NULL AND u.role='admin'`, [String(chatId)],
            ) : { rows: [{ count: 0 }] };
            const source = await readFile("/opt/telecampaign/artifacts/api-server/src/lib/support-telegram.ts");
            console.log("ORDER_MESSAGE_AUDIT=" + JSON.stringify({
              utc: new Date().toISOString(), orders: orders.rows,
              trackedMessages: refs.rows[0].count, eligibleAdminHistoryAccounts: account.rows[0].count,
              supportSourceSha256: createHash("sha256").update(source).digest("hex"),
            }));
            await client.query("ROLLBACK");
          } catch (error) {
            console.log("ORDER_MESSAGE_AUDIT_FAILED=" + (/^[0-9A-Z]{5}$/.test(error.code ?? "") ? error.code : "UNAVAILABLE"));
            process.exitCode = 1;
          } finally {
            await client.end();
          }
          
          NODE
          REMOTE
