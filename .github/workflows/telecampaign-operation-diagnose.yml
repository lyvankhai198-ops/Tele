name: TeleCamp admin join status (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: telecampaign-vps-operations
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect operation progress and final removal counts
        env:
          SSHPASS: ${{ secrets.TELECAMPAIGN_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          known="$(mktemp)"
          trap 'rm -f "$known"' EXIT
          ssh-keyscan -T 10 -t ed25519 15.235.142.30 > "$known" 2>/dev/null
          test "$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}')" = "SHA256:uMPDdpYzaBv+JdI9CSedvoRegH/XJVyucdN8mt7hZtM"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=15 ubuntu@15.235.142.30 'bash -s' <<'REMOTE'
          set -euo pipefail
          test "$(hostname)" = vps-cd243267
          cd /opt/telecampaign
          set -a
          source /etc/telecampaign/api.env
          set +a
          node --input-type=module <<'NODE'
          import { createRequire } from "node:module";
          const require = createRequire(new URL("file:///opt/telecampaign/lib/db/package.json"));
          const { Client } = require("pg");
          const client = new Client({ connectionString: process.env.DATABASE_URL, connectionTimeoutMillis: 10000 });
          try {
            await client.connect();
            await client.query("BEGIN READ ONLY");
            await client.query("SET LOCAL statement_timeout='10s'");
            const settings = (await client.query("SELECT value FROM system_settings WHERE key='admin_system_settings'")).rows[0];
            const config = settings ? JSON.parse(settings.value) : {};
            console.log("JOIN_SETTINGS=" + JSON.stringify({
              autoJoin: config.groupLibraryAutoJoinEnabled ?? true,
              autoCampaign: config.postJoinCampaign?.enabled ?? false,
              campaignMode: config.postJoinCampaign?.mode ?? null,
            }));
            const library = (await client.query(`SELECT count(*)::int AS total,
              count(*) FILTER (WHERE username IS NOT NULL AND username<>'')::int AS with_username
              FROM group_library_entries`)).rows[0];
            console.log("JOIN_LIBRARY=" + JSON.stringify(library));
            const accounts = (await client.query(`SELECT a.id,a.name,a.status,a.last_sync_at
              FROM telegram_accounts a JOIN app_users u ON a.owner_user_id=u.id::text
              WHERE u.role='admin' AND a.deleted_at IS NULL ORDER BY a.created_at`)).rows;
            for (const account of accounts) {
              const jobs = (await client.query(`SELECT j.status,count(*)::int AS count,
                max(j.next_attempt_at) FILTER (WHERE j.status='waiting') AS resume_at,
                count(*) FILTER (WHERE j.auto_campaign_id IS NOT NULL)::int AS linked_campaigns
                FROM admin_group_join_jobs j JOIN group_library_entries g ON g.id=j.group_library_entry_id
                WHERE j.telegram_account_id=$1 GROUP BY j.status ORDER BY j.status`, [account.id])).rows;
              const membership = (await client.query(`SELECT count(*)::int AS known_library_groups,
                count(*) FILTER (WHERE d.can_post)::int AS can_post
                FROM group_library_entries g JOIN destinations d ON d.telegram_id=g.telegram_id
                WHERE d.account_id=$1 AND d.topic_id IS NULL`, [account.id])).rows[0];
              const errors = (await client.query(`SELECT
                CASE WHEN last_error ILIKE '%FLOOD%' OR last_error ILIKE '%yêu cầu chờ%' THEN 'telegram_wait'
                WHEN last_error ILIKE '%username%' OR last_error ILIKE '%link mời%' THEN 'missing_or_invalid_link'
                WHEN last_error ILIKE '%CHANNELS_TOO_MUCH%' THEN 'account_group_limit'
                WHEN last_error ILIKE '%USER_CHANNELS_TOO_MUCH%' THEN 'account_group_limit'
                WHEN last_error ILIKE '%INVITE_REQUEST_SENT%' THEN 'approval_required'
                WHEN last_error ILIKE '%AUTH_KEY%' OR last_error ILIKE '%SESSION%' THEN 'session_error'
                WHEN last_error IS NULL THEN 'no_reason' ELSE 'other_telegram_error' END AS reason,
                count(*)::int AS count
                FROM admin_group_join_jobs WHERE telegram_account_id=$1 AND status IN ('failed','skipped','waiting')
                GROUP BY 1 ORDER BY count(*) DESC`, [account.id])).rows;
              console.log("JOIN_ACCOUNT=" + JSON.stringify({
                name: account.name, status: account.status, lastSyncAt: account.last_sync_at,
                jobs, membership, errors,
              }));
            }
            console.log("JOIN_CAPTURED_AT=" + new Date().toISOString());
            await client.query("ROLLBACK");
          } catch (error) {
            console.log("JOIN_ERROR=" + (/^[0-9A-Z]{5}$/.test(error.code ?? "") ? error.code : "safe_failure"));
            process.exitCode = 1;
          } finally {
            await client.end();
          }
          NODE
          REMOTE
