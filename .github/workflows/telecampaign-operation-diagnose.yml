name: VPS CPU RAM and disk snapshot (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: telecampaign-vps-operations
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read project CPU, RAM and disk counters
        env:
          SSHPASS: ${{ secrets.TELECAMPAIGN_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          known="$(mktemp)"
          trap 'rm -f "$known"' EXIT
          ssh-keyscan -T 10 -t ed25519 15.235.142.30 > "$known" 2>/dev/null
          test "$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}')" = "SHA256:uMPDdpYzaBv+JdI9CSedvoRegH/XJVyucdN8mt7hZtM"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=15 ubuntu@15.235.142.30 'sudo -n python3 -' <<'PY'
          """Bounded read-only counters; never emit logs, credentials or customer data."""
          import collections
          import datetime
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import time
          
          ROOT = pathlib.Path("/opt/telecampaign")
          assert pathlib.Path("/etc/hostname").read_text().strip() == "vps-cd243267"
          
          
          def emit(kind, value):
              print("MEMORY_" + kind + "=" + json.dumps(value), flush=True)
          
          
          def sample():
              memory = {}
              for line in pathlib.Path("/proc/meminfo").read_text().splitlines():
                  key, value = line.split(":", 1)
                  if key in ("MemTotal", "MemAvailable", "SwapTotal", "SwapFree"):
                      memory[key] = int(value.strip().split()[0]) * 1024
              processes = []
              uptime = float(pathlib.Path("/proc/uptime").read_text().split()[0])
              for path in pathlib.Path("/proc").iterdir():
                  if not path.name.isdigit():
                      continue
                  try:
                      cwd = pathlib.Path(os.readlink(path / "cwd"))
                      if cwd != ROOT and ROOT not in cwd.parents:
                          continue
                      raw = (path / "stat").read_text()
                      fields = raw[raw.rfind(")") + 2:].split()
                      processes.append({
                          "pid": int(path.name),
                          "age_seconds": round(uptime - int(fields[19]) / os.sysconf("SC_CLK_TCK")),
                          "rss_bytes": int(fields[21]) * os.sysconf("SC_PAGE_SIZE"),
                          "threads": int(fields[17]),
                          "fds": len(list((path / "fd").iterdir())),
                      })
                  except (OSError, ValueError):
                      continue
              emit("SAMPLE", {"utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                              "memory": memory, "processes": processes})
          
          
          for relative in (
              "artifacts/api-server/src/lib/telegram.ts",
              "artifacts/api-server/src/routes/telecampaign.ts",
              "pnpm-lock.yaml",
          ):
              content = (ROOT / relative).read_bytes()
              emit("SOURCE", {"path": relative, "sha256": hashlib.sha256(content).hexdigest()})
          sample()
          time.sleep(5)
          sample()
          for home in (pathlib.Path("/home/ubuntu"), pathlib.Path("/root")):
              for path in (home / ".pm2/logs").glob("telecampaign-api*.log"):
                  with path.open("rb") as handle:
                      handle.seek(0, 2)
                      size = handle.tell()
                      handle.seek(max(0, size - 512_000))
                      text = handle.read().decode("utf-8", errors="replace")
                  emit("LOG_COUNTS", {
                      "stream": "error" if "error" in path.name else "output",
                      "tail_bytes": min(size, 512_000),
                      "timeout": text.count("TIMEOUT"),
                      "reconnect": text.lower().count("reconnect"),
                      "heap_exhaustion": text.count("heap out of memory"),
                      "pool_timeout": text.count("timeout exceeded when trying to connect"),
                  })
          try:
              query = """BEGIN READ ONLY; SET LOCAL statement_timeout='3s';
              SELECT json_build_object('state',state,'wait_type',wait_event_type,
                'wait',wait_event,'count',count(*),
                'max_query_age_seconds',max(extract(epoch from now()-query_start)))
              FROM pg_stat_activity WHERE pid<>pg_backend_pid() AND backend_type='client backend'
              GROUP BY state,wait_event_type,wait_event; COMMIT;"""
              result = subprocess.run(
                  ["sudo", "-n", "-u", "postgres", "psql", "-X", "-A", "-t", "-c", query],
                  capture_output=True, text=True, timeout=8)
              for line in result.stdout.splitlines():
                  if line.startswith("{"):
                      emit("DB_WAITS", json.loads(line))
          except (OSError, subprocess.TimeoutExpired):
              emit("DB_STATUS", "unavailable")
          
          PY
