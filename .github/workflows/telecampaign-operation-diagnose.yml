name: Telecampaign bounded queue head inspection
on:
  workflow_dispatch:
    inputs:
      target_username:
        description: Account username to scope the bounded production audit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: telecampaign-vps-operations
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Install SSH password helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Sample current lease and worker evidence twice
        env:
          SSHPASS: ${{ secrets.TELECAMPAIGN_SSH_PASSWORD }}
          TARGET_USERNAME: ${{ inputs.target_username }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$TARGET_USERNAME" =~ ^[A-Za-z0-9_]{1,32}$ ]]
          known="$(mktemp)"
          trap 'rm -f "$known"' EXIT
          ssh-keyscan -T 10 -t ed25519 15.235.142.30 > "$known" 2>/dev/null
          test "$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}')" = "SHA256:uMPDdpYzaBv+JdI9CSedvoRegH/XJVyucdN8mt7hZtM"
          target_b64="$(printf %s "$TARGET_USERNAME" | base64 -w0)"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=15 ubuntu@15.235.142.30 "sudo -n env TARGET_USERNAME_B64=$target_b64 python3 -" <<'PY'
          """Read only, inspect a few queue heads instead of evaluating every target."""
          import base64
          import json
          import os
          import re
          import subprocess
          import time
          
          username = base64.b64decode(os.environ["TARGET_USERNAME_B64"]).decode()
          assert re.fullmatch(r"[A-Za-z0-9_]{1,32}", username)
          sql = """
          BEGIN READ ONLY; SET LOCAL statement_timeout='8s';
          WITH u AS (SELECT id::text owner FROM app_users WHERE username_normalized=lower(btrim(:'target_user'))),
          a AS (SELECT row_number() OVER(ORDER BY id) slot,*
            FROM telegram_accounts WHERE owner_user_id=(SELECT owner FROM u) AND deleted_at IS NULL),
          heads AS (
           SELECT a.slot,t.campaign_id,t.delivery_order,t.wait_before_seconds,t.next_attempt_at,
             c.timing_mode,c.status campaign_status,
             (SELECT count(*) FROM campaign_targets e WHERE e.campaign_id=t.campaign_id
               AND e.delivery_order<t.delivery_order AND e.status IN ('pending','sending')) earlier_pending,
             (SELECT coalesce(e.sent_at,e.updated_at)+t.wait_before_seconds*interval '1 second'
               FROM campaign_targets e WHERE e.campaign_id=t.campaign_id
               AND e.delivery_order=t.delivery_order-1 LIMIT 1) previous_gap_until
           FROM a CROSS JOIN LATERAL (
             SELECT t.* FROM campaign_targets t
             JOIN campaigns c ON c.id=t.campaign_id JOIN destinations d ON d.id=t.destination_id
             WHERE d.account_id=a.id AND c.owner_user_id=(SELECT owner FROM u)
               AND c.status IN ('queued','running') AND t.status='pending'
               AND (c.scheduled_at<=now() OR c.scheduled_at IS NULL)
               AND (t.next_attempt_at<=now() OR t.next_attempt_at IS NULL)
             ORDER BY t.next_attempt_at NULLS FIRST LIMIT 3
           ) t JOIN campaigns c ON c.id=t.campaign_id
          )
          SELECT json_build_object('at',now(),
           'accounts',(SELECT json_agg(json_build_object('slot',slot,'lease_until',delivery_lease_until,
             'updated_at',updated_at,'status',status)) FROM a),
           'heads',(SELECT json_agg(json_build_object('slot',slot,'timing_mode',timing_mode,
             'campaign_status',campaign_status,'order',delivery_order,'wait_seconds',wait_before_seconds,
             'next_attempt_at',next_attempt_at,'earlier_pending',earlier_pending,
             'previous_gap_until',previous_gap_until)) FROM heads),
           'subscription',(SELECT json_agg(json_build_object('plan',plan,'expires_at',expires_at))
             FROM subscriptions WHERE owner_user_id=(SELECT owner FROM u)));
          COMMIT;
          """
          for _ in range(2):
              r = subprocess.run(
                  ["sudo", "-n", "-u", "postgres", "psql", "-X", "-A", "-t", "-q", "-v",
                   "ON_ERROR_STOP=1", "-v", "target_user="+username, "-d", "telecampaign", "-f", "-"],
                  input=sql, capture_output=True, text=True, timeout=12)
              if r.returncode:
                  # SQL metadata errors only; never emit query text or interpolated data.
                  error = next((line for line in r.stderr.splitlines() if "ERROR:" in line), "")
                  category = ("statement_timeout" if "statement timeout" in error else
                              "missing_column" if "does not exist" in error else "query_error")
                  print("QUEUE_HEAD_ERROR=" + category, flush=True)
                  break
              print("QUEUE_HEAD=" + json.dumps(json.loads(r.stdout.strip().splitlines()[-1])), flush=True)
              time.sleep(5)
          
          PY
