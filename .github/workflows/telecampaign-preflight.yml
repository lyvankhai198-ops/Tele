name: Gift support chat compact formatting
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gift-bot-vps-operations
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Test live-source formatting and update only gift bot
        env:
          SSHPASS: ${{ secrets.TELECAMPAIGN_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          command -v sshpass >/dev/null || { sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq sshpass >/dev/null; }
          umask 077
          known="$(mktemp)"
          trap 'rm -f "$known"' EXIT
          ssh-keyscan -T 10 -t ed25519 15.235.142.30 >"$known" 2>/dev/null
          test "$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}')" = 'SHA256:uMPDdpYzaBv+JdI9CSedvoRegH/XJVyucdN8mt7hZtM'
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" ubuntu@15.235.142.30 'sudo -n python3 -' <<'PY'
          import ast,base64,hashlib,json,os,pathlib,stat,subprocess,tempfile,time
          root=pathlib.Path("/root/Bot-Qu-Tng")
          target=root/"bot.py"
          def prop(name,key):
              return subprocess.check_output(["systemctl","show",name,"--property="+key,"--value"],text=True).strip()
          assert prop("gift-bot.service","WorkingDirectory")==str(root)
          assert prop("gift-bot.service","ActiveState")=="active"
          before_api=prop("bot-api.service","MainPID")
          before_bot=prop("gift-bot.service","MainPID")
          source=target.read_bytes()
          original_sha=hashlib.sha256(source).hexdigest()
          candidate=source.decode()
          changes=json.loads(base64.b64decode(""))
          assert len(changes)==3
          for change in changes:
              assert candidate.count(change["old"])==1, "Formatting context differs; no files changed"
              candidate=candidate.replace(change["old"],change["new"],1)
          ast.parse(candidate)
          # All original functions outside the two formatters and notification
          # must be AST-identical, including menu, routing and support controls.
          before={n.name:ast.dump(n) for n in ast.parse(source.decode()).body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))}
          after={n.name:ast.dump(n) for n in ast.parse(candidate).body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))}
          changed={"_format_customer_message_for_admin","_notify_admin_with_history"}
          for name,value in before.items():
              if name not in changed:
                  assert after.get(name)==value, "Unrelated function changed"
          assert set(after)-set(before)=={"_compact_support_history_for_admin"}
          with tempfile.TemporaryDirectory(prefix=".support-format-test-",dir=root) as folder:
              folder=pathlib.Path(folder)
              code=folder/"bot.py"
              code.write_text(candidate)
              tests=folder/"test_chat_format.py"
              tests.write_bytes(base64.b64decode(""))
              env={**os.environ,"GIFT_CHAT_SOURCE":str(code),"PYTHONDONTWRITEBYTECODE":"1"}
              result=subprocess.run([str(root/"venv/bin/python"),str(tests)],env=env,capture_output=True,text=True,timeout=30)
              assert result.returncode==0, "Live-source chat formatting tests failed"
              print("GIFT_CHAT_FORMAT_TESTS=passed",flush=True)
              assert hashlib.sha256(target.read_bytes()).hexdigest()==original_sha, "Concurrent source change"
              metadata=target.stat()
              os.chmod(code,stat.S_IMODE(metadata.st_mode))
              os.chown(code,metadata.st_uid,metadata.st_gid)
              with code.open("rb") as handle: os.fsync(handle.fileno())
              os.replace(code,target)
          subprocess.run(["systemctl","restart","gift-bot.service"],capture_output=True,check=True,timeout=45)
          time.sleep(8)
          assert prop("gift-bot.service","ActiveState")=="active"
          assert prop("gift-bot.service","MainPID") not in ("0",before_bot)
          assert prop("bot-api.service","MainPID")==before_api
          assert target.read_text()==candidate
          print("GIFT_CHAT_FORMAT_DEPLOYED_SHA256="+hashlib.sha256(target.read_bytes()).hexdigest(),flush=True)
          print("GIFT_BOT_SERVICE=active",flush=True)
          print("GIFT_API_RESTARTED=false",flush=True)
          print("GIFT_CHAT_MENU_ROUTING_UNCHANGED=true",flush=True)
          print("GIFT_CHAT_CUSTOMER_DATA_WRITTEN=false",flush=True)
          PY
