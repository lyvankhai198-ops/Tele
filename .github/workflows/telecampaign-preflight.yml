name: Gift menu deployment read-only preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect gift deployment paths only
        env:
          SSHPASS: ${{ secrets.TELECAMPAIGN_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          command -v sshpass >/dev/null || { sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq sshpass >/dev/null; }
          umask 077
          known="$(mktemp)"
          trap 'rm -f "$known"' EXIT
          ssh-keyscan -T 10 -t ed25519 15.235.142.30 >"$known" 2>/dev/null
          test "$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}')" = 'SHA256:uMPDdpYzaBv+JdI9CSedvoRegH/XJVyucdN8mt7hZtM'
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" ubuntu@15.235.142.30 'sudo -n python3 -' <<'PY'
          import pathlib,subprocess,json,re,hashlib
          root=pathlib.Path("/root/Bot-Qu-Tng")
          for p in ["bot.py","artifacts/admin-panel/dist/public/index.html","artifacts/api-server/dist/index.mjs"]:
              path=root/p
              print("GIFT_PATH="+json.dumps({"path":p,"exists":path.exists(),"sha256":hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None}))
          text=pathlib.Path("/etc/nginx/sites-enabled/botadmin").read_text()
          for line in text.splitlines():
              if re.match(r"\s*(?:location|root|alias|server_name|listen)\s+",line):
                  print("GIFT_NGINX="+line.strip())
              elif re.match(r"\s*proxy_pass\s+http://(?:localhost|127\.0\.0\.1):\d+",line):
                  print("GIFT_NGINX="+line.strip())
          for name in ["gift-bot.service","bot-api.service"]:
              raw=subprocess.check_output(["systemctl","show",name,"--property=WorkingDirectory,MainPID,ActiveState,ExecStart","--no-pager"],text=True)
              for line in raw.splitlines():
                  if not line.startswith("ExecStart="): print("GIFT_SERVICE="+name+" "+line)
                  else:
                      print("GIFT_SERVICE_EXEC="+name+" "+str(re.findall(r"(?:path=)([^ ;]+)|(/[^ ;{}]+index\.mjs)",line)))
          PY
