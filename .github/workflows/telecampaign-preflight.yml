name: TeleCampaign preflight (no deployment)
on:
  workflow_dispatch:
    inputs:
      validate_candidate:
        description: Run full candidate build validation
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: telecampaign-vps-operations
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Install SSH password helper
        run: |
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Verify pinned server and inspect TeleCampaign only
        env:
          SSHPASS: ${{ secrets.TELECAMPAIGN_SSH_PASSWORD }}
          HOST_FINGERPRINT: SHA256:uMPDdpYzaBv+JdI9CSedvoRegH/XJVyucdN8mt7hZtM
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS" || { echo "SSH secret is missing"; exit 1; }
          umask 077
          known_hosts="$(mktemp)"
          trap 'rm -f "$known_hosts"' EXIT
          ssh-keyscan -T 10 -t ed25519 15.235.142.30 > "$known_hosts" 2>/dev/null
          actual="$(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}')"
          test "$actual" = "$HOST_FINGERPRINT" || { echo "SSH server identity changed; refusing connection"; exit 1; }
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
            -o ConnectTimeout=15 -o NumberOfPasswordPrompts=1 \
            -p 22 ubuntu@15.235.142.30 'bash -s' <<'REMOTE'
          set -euo pipefail
              test "$(hostname)" = vps-cd243267
              cd /opt/telecampaign
              printf 'inspection_source_commit='; git -c safe.directory=/opt/telecampaign rev-parse HEAD
              set -a
              source /etc/telecampaign/api.env
              set +a
              node --input-type=module <<'NODE'
              import fs from 'node:fs';
              import {execFileSync} from 'node:child_process';
              import {createRequire} from 'node:module';
              const require=createRequire(new URL('file:///opt/telecampaign/lib/db/package.json'));
              const {Client}=require('pg');
              let processInfo={found:false};
              try {
              const rows=JSON.parse(execFileSync('pm2',['jlist'],{encoding:'utf8',maxBuffer:3000000}));
              const p=rows.find(x=>x.name==='telecampaign-api');
              if(p){
              let runtimeEnv=p.pm2_env,source='pm2';
              try{runtimeEnv=Object.fromEntries(fs.readFileSync('/proc/'+p.pid+'/environ','utf8').split('\0').filter(x=>x.includes('=')).map(x=>{const i=x.indexOf('=');return[x.slice(0,i),x.slice(i+1)];}));source='proc';}catch{}
              processInfo={found:true,status:p.pm2_env.status,uptimeSeconds:Math.floor((Date.now()-p.pm2_env.pm_uptime)/1000),flagSource:source,disableAllWorkers:runtimeEnv.TELECAMPAIGN_DISABLE_WORKER==='true',disableGroupJoin:runtimeEnv.TELECAMPAIGN_DISABLE_GROUP_JOIN_WORKER==='true'};
              const seen={started:false,tickFailures:0,periodicSyncs:0,ownershipPause:false,disabled:false,lastSqlState:null,lastErrorTime:null};
              for(const path of new Set([p.pm2_env.pm_out_log_path,p.pm2_env.pm_err_log_path].filter(Boolean))){
              let text='';try{text=execFileSync('tail',['-c','524288',path],{encoding:'utf8',maxBuffer:600000});}catch{}
              for(const line of text.split('\n')){let x;try{x=JSON.parse(line);}catch{continue;}if(Number(x.time)<p.pm2_env.pm_uptime)continue;
              if(x.msg==='Admin group join worker started')seen.started=true;
              if(x.msg==='Admin group join worker tick failed'){seen.tickFailures++;seen.lastErrorTime=x.time;const code=x.err?.code;if(/^[A-Z0-9_]{2,40}$/.test(code??''))seen.lastSqlState=code;}
              if(x.msg==='Periodic Telegram group sync completed'||x.msg==='Periodic group sync and automatic campaign scan completed')seen.periodicSyncs++;
              if(x.msg==='Campaign worker is paused until legacy ownership is migrated')seen.ownershipPause=true;
              if(x.msg==='Campaign worker is disabled by TELECAMPAIGN_DISABLE_WORKER')seen.disabled=true;
              }
              }
              processInfo.logEvidence=seen;
              }
              }catch{processInfo.error='PROCESS_INSPECTION_UNAVAILABLE';}
              console.log('background_process='+JSON.stringify(processInfo));
              const client=new Client({connectionString:process.env.DATABASE_URL,connectionTimeoutMillis:10000});
              try{
              await client.connect();await client.query('SET default_transaction_read_only=on');await client.query("SET statement_timeout='5s'");await client.query("SET lock_timeout='1s'");
              const setting=(await client.query("SELECT value FROM system_settings WHERE key='admin_system_settings'")).rows[0]?.value;
              const s=typeof setting==='string'?JSON.parse(setting):setting;
              console.log('background_settings='+JSON.stringify({present:!!s,autoJoin:s?.groupLibraryAutoJoinEnabled??true,autoCampaign:s?.postJoinCampaign?.enabled??false,mode:s?.postJoinCampaign?.mode??'draft',hasContent:!!s?.postJoinCampaign?.content?.trim(),startGapSeconds:s?.postJoinCampaign?.campaignStartDelaySeconds??null}));
              const unmapped=await client.query('SELECT count(*)::int AS count FROM (SELECT owner_user_id FROM telegram_accounts UNION SELECT owner_user_id FROM campaigns) owners WHERE NOT EXISTS(SELECT 1 FROM app_users WHERE app_users.id::text=owners.owner_user_id)');
              console.log('background_unmapped_owners='+unmapped.rows[0].count);
              const accounts=await client.query("SELECT count(*)::int AS total,count(*) FILTER(WHERE a.status='connected' AND a.session_encrypted IS NOT NULL AND a.telegram_user_id IS NOT NULL)::int AS eligible FROM telegram_accounts a JOIN app_users u ON a.owner_user_id=u.id::text WHERE u.role='admin' AND a.deleted_at IS NULL");
              console.log('background_admin_accounts='+JSON.stringify(accounts.rows[0]));
              for(let pass=0;pass<2;pass++){
              const jobs=await client.query("SELECT status,count(*)::int AS count,count(*) FILTER(WHERE next_attempt_at<=now())::int AS due,count(*) FILTER(WHERE lease_until>now())::int AS leased,max(last_attempt_at) AS last_attempt,max(updated_at) AS last_update FROM admin_group_join_jobs GROUP BY status ORDER BY status");
              console.log('background_jobs_'+pass+'='+JSON.stringify(jobs.rows.map(x=>({...x,status:/^[a-z_]{1,24}$/.test(x.status)?x.status:'unknown'}))));
              const recent=await client.query("SELECT row_number() OVER(ORDER BY a.created_at DESC)::int AS account_slot,a.status,a.created_at,(SELECT count(*)::int FROM admin_group_join_jobs j WHERE j.telegram_account_id=a.id) AS jobs,(SELECT count(*)::int FROM admin_group_join_jobs j WHERE j.telegram_account_id=a.id AND j.status='joined') AS joined,(SELECT count(*)::int FROM campaigns c WHERE c.telegram_account_id=a.id AND c.name LIKE 'Tự động sau khi tham gia:%') AS automatic_campaigns FROM telegram_accounts a JOIN app_users u ON a.owner_user_id=u.id::text WHERE u.role='admin' AND a.deleted_at IS NULL ORDER BY a.created_at DESC LIMIT 5");
              console.log('background_recent_accounts_'+pass+'='+JSON.stringify(recent.rows));
              if(pass===0)await new Promise(r=>setTimeout(r,30000));
              }
              }catch(e){console.log('background_sqlstate='+(/^[A-Z0-9]{5}$/.test(e.code??'')?e.code:'UNKNOWN'));process.exitCode=1;}finally{await client.end();}
              NODE
          REMOTE
