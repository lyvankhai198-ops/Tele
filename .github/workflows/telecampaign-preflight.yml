name: Gift bot scoped menu visibility update
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gift-bot-vps-operations
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Validate and apply only three menu changes
        env:
          SSHPASS: ${{ secrets.TELECAMPAIGN_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          command -v sshpass >/dev/null || { sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq sshpass >/dev/null; }
          umask 077
          known="$(mktemp)"
          trap 'rm -f "$known"' EXIT
          ssh-keyscan -T 10 -t ed25519 15.235.142.30 >"$known" 2>/dev/null
          test "$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}')" = 'SHA256:uMPDdpYzaBv+JdI9CSedvoRegH/XJVyucdN8mt7hZtM'
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=15 ubuntu@15.235.142.30 'sudo -n python3 -' <<'PY'
          import ast,base64,hashlib,json,os,pathlib,subprocess,tempfile,time,stat
          root=pathlib.Path("/root/Bot-Qu-Tng")
          target=root/"bot.py"
          expected="2f771db02bbc6814f3f96f71c3c1e8c6b3baad246c784949f522b185a5353174"
          def property(service,key):
              return subprocess.check_output(["systemctl","show",service,"--property="+key,"--value"],text=True).strip()
          before_api=property("bot-api.service","MainPID")
          before_gift=property("gift-bot.service","MainPID")
          assert property("gift-bot.service","WorkingDirectory")==str(root), "Unexpected service root"
          assert property("gift-bot.service","ActiveState")=="active", "Gift service not active before change"
          source=target.read_bytes()
          assert hashlib.sha256(source).hexdigest()==expected, "Gift source changed; refusing overwrite"
          text=source.decode()
          patch=json.loads(base64.b64decode(""))
          assert len(patch)==3
          for change in patch:
              assert text.count(change["old"])==1, "Menu patch does not match live source"
              text=text.replace(change["old"],change["new"],1)
          ast.parse(text)
          candidate=text.encode()
          tests=base64.b64decode("")
          with tempfile.TemporaryDirectory(prefix=".menu-validation-",dir=root) as temp:
              temp=pathlib.Path(temp)
              code=temp/"bot.py"
              code.write_bytes(candidate)
              suite=temp/"test_menu_visibility.py"
              suite.write_bytes(tests)
              env={**os.environ,"BOT_MENU_SOURCE":str(code),"PYTHONDONTWRITEBYTECODE":"1"}
              result=subprocess.run([str(root/"venv/bin/python"),str(suite)],env=env,capture_output=True,text=True,timeout=30)
              assert result.returncode==0, "Live-source menu regression tests failed"
              print("GIFT_MENU_REGRESSION=passed",flush=True)
              # Exercise the installed Telegram library and the real settings reader,
              # importing neither the full bot nor any polling/notification code.
              smoke=r'''
          import ast,json,sys
          from pathlib import Path
          from telegram import ReplyKeyboardMarkup
          sys.path.insert(0,"/root/Bot-Qu-Tng")
          import data_manager as db
          from translations import t
          tree=ast.parse(Path(sys.argv[1]).read_text())
          fn=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=="main_keyboard")
          ns={"db":db,"t":t,"lang":lambda _:"vi","ReplyKeyboardMarkup":ReplyKeyboardMarkup}
          exec(compile(ast.Module(body=[fn],type_ignores=[]),sys.argv[1],"exec"),ns)
          settings=db.get_settings()
          keys=ns["main_keyboard"](0).keyboard
          visible=[button.text for row in keys for button in row]
          for key,flag in [("btn_support","support_enabled"),("btn_gift","gift_enabled"),("btn_intro","intro_enabled")]:
              assert (t("vi",key) in visible)==bool(settings.get(flag,True))
          for key in ["btn_check_order","btn_shop","btn_chat_support"]:
              assert t("vi",key) in visible
          print("GIFT_MENU_LIVE_SETTINGS=passed")
          '''
              result=subprocess.run([str(root/"venv/bin/python"),"-c",smoke,str(code)],cwd=root,env=env,capture_output=True,text=True,timeout=20)
              assert result.returncode==0, "Installed Telegram/settings smoke check failed"
              print("GIFT_MENU_LIVE_SETTINGS=passed",flush=True)
              # Re-check immediately before the atomic single-file replacement.
              assert hashlib.sha256(target.read_bytes()).hexdigest()==expected, "Concurrent source modification"
              metadata=target.stat()
              os.chmod(code,stat.S_IMODE(metadata.st_mode))
              os.chown(code,metadata.st_uid,metadata.st_gid)
              with code.open("rb") as handle: os.fsync(handle.fileno())
              os.replace(code,target)
          subprocess.run(["systemctl","restart","gift-bot.service"],check=True,timeout=45,capture_output=True)
          time.sleep(8)
          assert property("gift-bot.service","ActiveState")=="active", "Gift bot startup failed"
          assert property("gift-bot.service","MainPID") not in ("0",before_gift), "Gift process did not restart"
          assert property("bot-api.service","MainPID")==before_api, "Unexpected API process change"
          assert target.read_bytes()==candidate
          print("GIFT_DEPLOYED_FILE_SHA256="+hashlib.sha256(candidate).hexdigest(),flush=True)
          print("GIFT_BOT_SERVICE=active",flush=True)
          print("GIFT_API_RESTARTED=false",flush=True)
          print("GIFT_DATA_CHANGED=false",flush=True)
          PY
