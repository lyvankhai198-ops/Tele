name: TeleCamp read-only activation analysis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Aggregate customer adoption without personal data or writes
        env:
          SSHPASS: ${{ secrets.TELECAMPAIGN_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          command -v sshpass >/dev/null || { sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq sshpass >/dev/null; }
          umask 077
          known="$(mktemp)"
          trap 'rm -f "$known"' EXIT
          ssh-keyscan -T 10 -t ed25519 15.235.142.30 >"$known" 2>/dev/null
          test "$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}')" = 'SHA256:uMPDdpYzaBv+JdI9CSedvoRegH/XJVyucdN8mt7hZtM'
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" ubuntu@15.235.142.30 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/telecampaign
          set -a
          source /etc/telecampaign/api.env
          set +a
          node --input-type=module <<'JS'
          import {createRequire} from 'node:module';
          const require=createRequire(process.cwd()+"/lib/db/package.json");
          const {Client}=require("pg");
          const client=new Client({connectionString:process.env.DATABASE_URL,connectionTimeoutMillis:5000,statement_timeout:25000});
          let phase="connect";
          const out=(kind,rows)=>console.log("ADOPTION_"+kind+"="+JSON.stringify(rows));
          try {
            await client.connect();
            await client.query("BEGIN TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY");
            const ctx=await client.query(`SELECT now() AS observed_at, count(*)::int AS customers, min(created_at) AS first_customer,
              count(*) FILTER(WHERE created_at>now()-interval '24 hours')::int AS registered_under_24h
              FROM app_users WHERE role='user'`);
            out("CONTEXT",ctx.rows);
            phase="funnel";
            const funnel=await client.query(`
              WITH log_flags AS (
                SELECT owner_user_id,
                  bool_or(event='account.login_started') AS attempted,
                  bool_or(event='account.connected') AS connected,
                  bool_or(event='destinations.synced') AS synced,
                  bool_or(event IN ('campaign.created','campaign.auto_created_after_group_join','campaign.cloned_by_user')) AS created_campaign,
                  bool_or(event='campaign.target.sent') AS sent,
                  min(created_at) FILTER(WHERE event='campaign.target.sent') AS first_sent,
                  count(DISTINCT (created_at AT TIME ZONE 'Asia/Ho_Chi_Minh')::date) FILTER(WHERE event='campaign.target.sent') AS send_days,
                  bool_or(event='auth.login' AND created_at>now()-interval '7 days') AS login_7d
                FROM activity_logs
                WHERE event IN ('account.login_started','account.connected','destinations.synced','campaign.created',
                  'campaign.auto_created_after_group_join','campaign.cloned_by_user','campaign.target.sent','auth.login')
                GROUP BY owner_user_id
              ), flags AS (
                SELECT u.created_at,
                  coalesce(l.attempted,false) OR EXISTS(SELECT 1 FROM telegram_accounts a WHERE a.owner_user_id=u.id::text) AS attempted,
                  coalesce(l.connected,false) OR EXISTS(SELECT 1 FROM telegram_accounts a WHERE a.owner_user_id=u.id::text AND a.session_encrypted IS NOT NULL) AS connected,
                  EXISTS(SELECT 1 FROM telegram_accounts a WHERE a.owner_user_id=u.id::text AND a.status='connected' AND a.deleted_at IS NULL) AS connected_now,
                  coalesce(l.synced,false) OR EXISTS(SELECT 1 FROM telegram_accounts a JOIN destinations d ON d.account_id=a.id WHERE a.owner_user_id=u.id::text) AS synced,
                  coalesce(l.created_campaign,false) OR EXISTS(SELECT 1 FROM campaigns c WHERE c.owner_user_id=u.id::text) AS created_campaign,
                  coalesce(l.sent,false) AS sent_logged,
                  coalesce(l.sent,false) OR EXISTS(SELECT 1 FROM campaigns c JOIN campaign_targets t ON t.campaign_id=c.id WHERE c.owner_user_id=u.id::text AND t.sent_at IS NOT NULL) AS sent,
                  l.first_sent,coalesce(l.send_days,0) AS send_days,coalesce(l.login_7d,false) AS login_7d,
                  EXISTS(SELECT 1 FROM license_keys k WHERE k.claimed_by=u.id::text AND k.claimed_at IS NOT NULL) AS key_activated,
                  EXISTS(SELECT 1 FROM purchase_orders p WHERE p.owner_user_id=u.id::text AND p.status='paid') AS paid_order,
                  EXISTS(SELECT 1 FROM purchase_orders p WHERE p.owner_user_id=u.id::text) AS ordered,
                  EXISTS(SELECT 1 FROM subscriptions s WHERE s.owner_user_id=u.id::text AND (s.expires_at IS NULL OR s.expires_at>now())) AS active_plan
                FROM app_users u LEFT JOIN log_flags l ON l.owner_user_id=u.id::text WHERE u.role='user'
              )
              SELECT cohort,count(*)::int AS registered,
                count(*) FILTER(WHERE active_plan)::int AS active_plan_now,
                count(*) FILTER(WHERE attempted)::int AS attempted_connection,
                count(*) FILTER(WHERE connected)::int AS connected_ever_evidence,
                count(*) FILTER(WHERE connected_now)::int AS connected_now,
                count(*) FILTER(WHERE synced)::int AS synced,
                count(*) FILTER(WHERE created_campaign)::int AS created_campaign_including_quick_send,
                count(*) FILTER(WHERE sent)::int AS sent,
                count(*) FILTER(WHERE sent_logged)::int AS sent_log_evidence,
                count(*) FILTER(WHERE send_days>=2)::int AS sent_on_two_days_log_evidence,
                count(*) FILTER(WHERE first_sent<=created_at+interval '24 hours')::int AS sent_within_first_24h_log_evidence,
                count(*) FILTER(WHERE ordered)::int AS ordered,
                count(*) FILTER(WHERE paid_order)::int AS paid_order,
                count(*) FILTER(WHERE key_activated)::int AS key_activated,
                count(*) FILTER(WHERE NOT attempted AND NOT connected AND NOT created_campaign AND NOT sent)::int AS no_connection_attempt_evidence,
                count(*) FILTER(WHERE attempted AND NOT connected AND NOT sent)::int AS attempted_not_connected,
                count(*) FILTER(WHERE connected AND NOT synced AND NOT sent)::int AS connected_not_synced,
                count(*) FILTER(WHERE synced AND NOT created_campaign AND NOT sent)::int AS synced_no_campaign,
                count(*) FILTER(WHERE created_campaign AND NOT sent)::int AS campaign_no_send,
                count(*) FILTER(WHERE NOT sent AND NOT active_plan)::int AS no_send_plan_expired_now,
                count(*) FILTER(WHERE NOT sent AND active_plan)::int AS no_send_plan_active_now,
                count(*) FILTER(WHERE login_7d AND NOT sent)::int AS recent_login_no_send
              FROM flags CROSS JOIN (VALUES('all',NULL::interval,NULL::interval),
                ('30d',interval '30 days',NULL::interval),('7d',interval '7 days',NULL::interval),
                ('30d_mature_24h',interval '30 days',interval '24 hours')) b(cohort,lookback,min_age)
              WHERE (lookback IS NULL OR created_at>=now()-lookback) AND (min_age IS NULL OR created_at<=now()-min_age)
              GROUP BY cohort ORDER BY cohort`);
            out("FUNNEL",funnel.rows);
            phase="breakdowns";
            const queries={
              LANGUAGE:`SELECT preferred_language AS language,count(*)::int AS customers FROM app_users WHERE role='user' GROUP BY preferred_language`,
              WEEK:`SELECT to_char(date_trunc('week',created_at AT TIME ZONE 'Asia/Ho_Chi_Minh'),'YYYY-MM-DD') AS week,count(*)::int AS registrations FROM app_users WHERE role='user' AND created_at>now()-interval '60 days' GROUP BY 1 ORDER BY 1`,
              ACCOUNTS:`SELECT a.status,(a.deleted_at IS NOT NULL) AS deleted,count(*)::int AS accounts,count(DISTINCT a.owner_user_id)::int AS customers FROM telegram_accounts a JOIN app_users u ON u.id::text=a.owner_user_id AND u.role='user' GROUP BY 1,2`,
              CHALLENGES:`SELECT c.status,c.requires_two_factor,count(*)::int AS attempts,count(DISTINCT c.owner_user_id)::int AS customers FROM auth_challenges c JOIN app_users u ON u.id::text=c.owner_user_id AND u.role='user' WHERE c.created_at>now()-interval '30 days' GROUP BY 1,2`,
              CAMPAIGNS:`SELECT c.status,count(*)::int AS campaigns,count(DISTINCT c.owner_user_id)::int AS customers FROM campaigns c JOIN app_users u ON u.id::text=c.owner_user_id AND u.role='user' GROUP BY c.status`,
              ORDERS:`SELECT p.status,p.currency,count(*)::int AS orders,count(DISTINCT p.owner_user_id)::int AS customers FROM purchase_orders p JOIN app_users u ON u.id::text=p.owner_user_id AND u.role='user' WHERE p.created_at>now()-interval '30 days' GROUP BY 1,2`,
              LOG_COVERAGE:`SELECT min(created_at) AS earliest_retained,max(created_at) AS latest_retained,count(*)::int AS rows FROM activity_logs`,
              ERROR_EVENTS:`SELECT l.event,count(*)::int AS occurrences,count(DISTINCT l.owner_user_id)::int AS customers FROM activity_logs l JOIN app_users u ON u.id::text=l.owner_user_id AND u.role='user' WHERE l.created_at>now()-interval '30 days' AND l.level IN ('error','warning','warn') GROUP BY l.event ORDER BY count(*) DESC LIMIT 12`
            };
            for(const [kind,sql] of Object.entries(queries)){phase=kind;out(kind,(await client.query(sql)).rows);}
            await client.query("ROLLBACK");
            out("COMPLETE",true);
          } catch(error) {
            console.log("ADOPTION_ERROR="+JSON.stringify({phase,code:/^[0-9A-Z]{5}$/.test(error.code||"")?error.code:"safe_failure"}));
            process.exitCode=1;
          } finally {await client.end();}
          JS
          REMOTE
