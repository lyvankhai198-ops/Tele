name: TeleCamp bulk rerun read-only diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read only aggregate rerun state without customer details
        env:
          SSHPASS: ${{ secrets.TELECAMPAIGN_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          command -v sshpass >/dev/null || { sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq sshpass >/dev/null; }
          umask 077
          known="$(mktemp)"
          trap 'rm -f "$known"' EXIT
          ssh-keyscan -T 10 -t ed25519 15.235.142.30 >"$known" 2>/dev/null
          test "$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}')" = 'SHA256:uMPDdpYzaBv+JdI9CSedvoRegH/XJVyucdN8mt7hZtM'
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" ubuntu@15.235.142.30 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/telecampaign
          printf 'RERUN_LIVE_COMMIT='; git rev-parse HEAD
          set -a
          source /etc/telecampaign/api.env
          set +a
          node --input-type=module <<'JS'
          import {createRequire} from 'node:module';
          const require=createRequire(process.cwd()+"/lib/db/package.json");
          const {Client}=require("pg");
          const client=new Client({connectionString:process.env.DATABASE_URL,connectionTimeoutMillis:5000,statement_timeout:5000});
          try {
            await client.connect();
            await client.query("BEGIN READ ONLY");
            const stats=await client.query(`SELECT count(*) FILTER (WHERE state='active')::int AS active_queries,
              count(*) FILTER (WHERE wait_event_type='Lock')::int AS lock_waiters,
              count(*) FILTER (WHERE state='active' AND query ILIKE '%campaign_targets%' AND query ILIKE '%FOR UPDATE%')::int AS target_lock_queries,
              count(*) FILTER (WHERE state='active' AND query ILIKE 'insert into "campaign_targets"%')::int AS target_insert_queries
              FROM pg_stat_activity WHERE datname=current_database() AND pid<>pg_backend_pid()`);
            for(const [key,value] of Object.entries(stats.rows[0])) console.log("RERUN_DB_"+key+"="+value);
            const sizes=await client.query(`SELECT count(*)::int AS completed,
              coalesce(sum(repeat_count*greatest(cardinality(destination_ids),1)),0)::text AS estimated_targets,
              max(repeat_count)::int AS largest_repeat
              FROM campaigns WHERE status IN ('completed','completed_with_errors')`);
            for(const [key,value] of Object.entries(sizes.rows[0])) console.log("RERUN_COMPLETED_"+key+"="+value);
            const recent=await client.query(`SELECT count(*)::int AS created_runs,
              count(*) FILTER (WHERE status='queued')::int AS queued_runs,
              count(*) FILTER (WHERE status='running')::int AS running_runs
              FROM campaigns WHERE cloned_from_campaign_id IS NOT NULL AND created_at>now()-interval '2 hours'`);
            for(const [key,value] of Object.entries(recent.rows[0])) console.log("RERUN_RECENT_"+key+"="+value);
            const events=await client.query(`SELECT count(*)::int AS rerun_events FROM activity_logs
              WHERE event='campaign.bulk_rerun_created' AND created_at>now()-interval '2 hours'`);
            console.log("RERUN_RECENT_events="+events.rows[0].rerun_events);
            await client.query("ROLLBACK");
          } catch(error) {
            console.log("RERUN_DIAGNOSTIC_ERROR="+(/^[0-9A-Z]{5}$/.test(error.code||"")?error.code:"safe_failure"));
            process.exitCode=1;
          } finally {await client.end();}
          JS
          REMOTE
