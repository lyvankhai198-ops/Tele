name: Gift menu reviewed production deployment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gift-bot-vps-operations
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare isolated release tools and pinned SSH
        env:
          SSHPASS: ${{ secrets.TELECAMPAIGN_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          command -v sshpass >/dev/null || { sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq sshpass >/dev/null; }
          umask 077
          mkdir -p "$RUNNER_TEMP/gift-menu/source/gift-ops"
          cd "$RUNNER_TEMP/gift-menu"
          python3 - <<'PY'
          import base64,io,tarfile
          content=base64.b64decode("")
          with tarfile.open(fileobj=io.BytesIO(content)) as t:
              t.extractall("source/gift-ops",filter="data")
          PY
          ssh-keyscan -T 10 -t ed25519 15.235.142.30 >known_hosts 2>/dev/null
          test "$(ssh-keygen -lf known_hosts -E sha256 | awk '{print $2}')" = 'SHA256:uMPDdpYzaBv+JdI9CSedvoRegH/XJVyucdN8mt7hZtM'
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PWD/known_hosts" ubuntu@15.235.142.30 \
            'sudo -n python3 -' <source/gift-ops/export_source.py >source.tgz
          tar -xzf source.tgz -C source
          echo 'GIFT_CURRENT_SOURCE_CAPTURE=passed'
      - name: Validate scoped patch against actual current VPS source
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gift-menu/source"
          python3 gift-ops/apply_patch.py --candidate "$PWD"
          GIFT_SOURCE_ROOT="$PWD" python3 gift-ops/test_bot_menu.py
      - name: Install locked build dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.11.0 --activate
          cd "$RUNNER_TEMP/gift-menu/source"
          pnpm install --frozen-lockfile
      - name: Test web to API to bot settings and build both applications
        env:
          PORT: '3000'
          BASE_PATH: /admin-panel/
          NODE_ENV: production
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gift-menu/source"
          GIFT_SOURCE_ROOT="$PWD" node gift-ops/test_settings.mjs
          pnpm --filter @workspace/admin-panel run build
          pnpm --filter @workspace/api-server run build
          python3 gift-ops/package_release.py
          echo 'GIFT_ACTUAL_SOURCE_BUILD=passed'
      - name: Activate only verified gift website API and bot
        env:
          SSHPASS: ${{ secrets.TELECAMPAIGN_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gift-menu"
          remote="$(sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PWD/known_hosts" ubuntu@15.235.142.30 'umask 077; mktemp -d /tmp/gift-menu-release.XXXXXX')"
          [[ "$remote" =~ ^/tmp/gift-menu-release\.[a-zA-Z0-9]+$ ]]
          sshpass -e scp -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PWD/known_hosts" source/gift-menu-release.tgz source/gift-ops/activate_release.py ubuntu@15.235.142.30:"$remote/"
          sha="$(sha256sum source/gift-menu-release.tgz | awk '{print $1}')"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PWD/known_hosts" ubuntu@15.235.142.30 \
            "sudo -n python3 '$remote/activate_release.py' '$remote/gift-menu-release.tgz' '$sha'"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PWD/known_hosts" ubuntu@15.235.142.30 "rm -rf -- '$remote'"
      - name: Verify publicly served website and protected API
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gift-menu/source"
          curl --fail --silent --show-error --max-time 20 http://15.235.142.30/admin-panel/ >../public-index.html
          cmp artifacts/admin-panel/dist/public/index.html ../public-index.html
          asset="$(python3 -c 'import re; print(re.search(r"src=\"([^\"]+\.js)\"",open("../public-index.html").read()).group(1))')"
          [[ "$asset" == /admin-panel/assets/*.js ]]
          curl --fail --silent --show-error --max-time 20 "http://15.235.142.30$asset" >../public-main.js
          cmp "artifacts/admin-panel/dist/public/${asset#/admin-panel/}" ../public-main.js
          grep -q 'checkOrderEnabled' ../public-main.js
          grep -q 'chatSupportEnabled' ../public-main.js
          code="$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' http://15.235.142.30/api/bot/settings)"
          test "$code" = 401
          echo 'GIFT_PUBLIC_RELEASE_HASH=passed'
          echo 'GIFT_SETTINGS_AUTH_GUARD=passed'
