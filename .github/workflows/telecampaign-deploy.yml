name: TeleCampaign fast deployment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: telecampaign-vps-operations
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      test-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: telecamp_test
          POSTGRES_DB: telecamp_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telecamp_test -d telecamp_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - name: Fetch exact reviewed source
        env:
          TARGET: ${{ github.sha }}
        run: |
          git init candidate
          cd candidate
          git remote add origin https://github.com/lyvankhai198-ops/Tele.git
          git fetch --depth=1 origin "$TARGET"
          git checkout --detach FETCH_HEAD
      - name: Test both safety changes
        working-directory: candidate
        run: |
          bash -n scripts/*.sh scripts/lib/telecampaign-release.sh
          python3 scripts/tests/test_release_safety.py
          node --experimental-vm-modules --test scripts/tests/manual-order-review.test.mjs
          node --experimental-vm-modules --test scripts/tests/telegram-license-lookup.test.mjs
          node --experimental-vm-modules --test scripts/tests/admin-tools.test.mjs
          node --experimental-vm-modules --test scripts/tests/admin-key-access.test.mjs
      - name: Restore dependency download cache
        id: pnpm-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: telecamp-pnpm24-${{ runner.os }}-${{ hashFiles('candidate/pnpm-lock.yaml') }}
      - name: Install exact locked dependencies
        working-directory: candidate
        run: npx --yes pnpm@10.26.1 install --frozen-lockfile --store-dir "$RUNNER_TEMP/pnpm-store"
      - name: Save dependency cache before validation for inexpensive retries
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - name: Typecheck exact target
        working-directory: candidate
        env:
          PORT: "3004"
          BASE_PATH: /
        run: |
          npx --yes pnpm@10.26.1 run typecheck:libs
          npx --yes pnpm@10.26.1 --filter @workspace/telecampaign run typecheck
          npx --yes pnpm@10.26.1 --filter @workspace/api-server run typecheck
      - name: Install SSH password helper for private frontend environment
        # The fixture database and test runner never receive production secrets.
        run: |
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Integration test web API, payments, bot lookups and admin MFA on disposable data
        working-directory: candidate
        env:
          DATABASE_URL: postgres://telecamp_test@127.0.0.1:5432/telecamp_test
        run: |
          npx --yes pnpm@10.26.1 --filter @workspace/db run push-force
          node scripts/tests/run-admin-tools-e2e.mjs
      - name: Read frontend build environment without logging values
        env:
          SSHPASS: ${{ secrets.TELECAMPAIGN_SSH_PASSWORD }}
          HOST_FINGERPRINT: SHA256:uMPDdpYzaBv+JdI9CSedvoRegH/XJVyucdN8mt7hZtM
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          known_hosts="$(mktemp)"
          trap 'rm -f "$known_hosts"' EXIT
          ssh-keyscan -T 10 -t ed25519 15.235.142.30 > "$known_hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}')" = "$HOST_FINGERPRINT"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
            -o ConnectTimeout=15 ubuntu@15.235.142.30 'bash -s' \
            > "$RUNNER_TEMP/telecampaign-frontend-env.json" <<'REMOTE'
          set -euo pipefail
          test "$(hostname)" = vps-cd243267
          set -a
          source /etc/telecampaign/api.env
          set +a
          cd /opt/telecampaign/artifacts/telecampaign
          node --input-type=module -e 'import {loadEnv} from "vite";process.stdout.write(JSON.stringify(loadEnv("production",process.cwd(),"VITE_")));'
          REMOTE
          python3 - <<'PY'
          import json, os
          values=json.load(open(os.environ["RUNNER_TEMP"]+"/telecampaign-frontend-env.json"))
          assert isinstance(values,dict) and all(k.startswith("VITE_") and isinstance(v,str) for k,v in values.items())
          print("Frontend build environment received privately; values are not logged.")
          PY
      - name: Fingerprint frontend environment without exposing values
        id: frontend-env
        run: |
          python3 - <<'PY'
          import json,hashlib,os
          with open(os.environ["RUNNER_TEMP"]+"/telecampaign-frontend-env.json") as f: values=json.load(f)
          digest=hashlib.sha256(json.dumps(values,sort_keys=True).encode()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"],"a") as f: f.write("hash="+digest+"\n")
          PY
      - name: Reuse frontend when build inputs are unchanged
        id: frontend-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: candidate/artifacts/telecampaign/dist
          key: telecamp-ui24-v1-${{ runner.os }}-${{ steps.frontend-env.outputs.hash }}-${{ hashFiles('candidate/artifacts/telecampaign/**', 'candidate/lib/api-client-react/**', 'candidate/lib/api-zod/**', 'candidate/pnpm-lock.yaml', 'candidate/pnpm-workspace.yaml', 'candidate/tsconfig.base.json', '!candidate/**/node_modules/**', '!candidate/**/dist/**', '!candidate/**/.vite/**') }}
      - name: Build and package ready-to-run runtime on GitHub
        working-directory: candidate
        env:
          TARGET: ${{ github.sha }}
          PORT: "3004"
          BASE_PATH: /
          FRONTEND_CACHE_HIT: ${{ steps.frontend-cache.outputs.cache-hit }}
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          python3 - <<'PY'
          import json, os, subprocess
          path=os.environ["RUNNER_TEMP"]+"/telecampaign-frontend-env.json"
          values=json.load(open(path))
          env={**os.environ,**values}
          if os.environ.get("FRONTEND_CACHE_HIT")!="true" or not os.path.isfile("artifacts/telecampaign/dist/public/index.html"):
            subprocess.run(["npx","--yes","pnpm@10.26.1","--filter","@workspace/telecampaign","run","build"],env=env,check=True)
          else:
            print("Reusing frontend: source, dependencies and build environment are unchanged.")
          subprocess.run(["npx","--yes","pnpm@10.26.1","--filter","@workspace/api-server","run","build"],check=True)
          os.remove(path)
          PY
          source scripts/lib/telecampaign-release.sh
          ROOT="$PWD"
          package="$RUNNER_TEMP/telecampaign-runtime"
          umask 077
          mkdir -m 0700 "$package"
          release_runtime_paths > "$package/RUNTIME_PATHS"
          printf '%s\n' "$TARGET" > "$package/COMMIT"
          node -p 'process.platform+":"+process.arch+":"+process.versions.modules' > "$package/PLATFORM"
          tar -czf "$package/runtime.tar.gz" -C "$ROOT" --null --files-from="$package/RUNTIME_PATHS"
          (cd "$package" && sha256sum COMMIT PLATFORM RUNTIME_PATHS runtime.tar.gz > SHA256SUMS)
          printf 'telecampaign-runtime-v1\n' > "$package/COMPLETE"
      - name: Transfer only packaged runtime to the deployment job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telecampaign-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/telecampaign-runtime/
          retention-days: 1
          compression-level: 0
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download verified prebuilt runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: telecampaign-runtime-${{ github.sha }}
          path: runtime
      - name: Package pinned recovery controls
        env:
          CONTROL_SHA: 090cf7ecfcc917068dcf82130a0c2fc8d5cd7e9a
        run: |
          git init controls
          cd controls
          git remote add origin https://github.com/lyvankhai198-ops/Tele.git
          git fetch --depth=1 origin "$CONTROL_SHA"
          git archive --format=tar.gz --output=../telecampaign-controls.tar.gz FETCH_HEAD \
            scripts/lib/telecampaign-release.sh scripts/deploy-telecampaign.sh \
            scripts/checkpoint-telecampaign.sh scripts/rollback-telecampaign.sh \
            scripts/backup-telecampaign.sh scripts/restore-telecampaign.sh \
            scripts/prepare-notification-media-storage.sh
      - name: Install SSH password helper
        run: |
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
      - name: Deploy TeleCampaign without backup or automatic rollback
        env:
          SSHPASS: ${{ secrets.TELECAMPAIGN_SSH_PASSWORD }}
          TARGET: ${{ github.sha }}
          CONTROL_SHA: 090cf7ecfcc917068dcf82130a0c2fc8d5cd7e9a
          HOST_FINGERPRINT: SHA256:uMPDdpYzaBv+JdI9CSedvoRegH/XJVyucdN8mt7hZtM
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ && "$CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$SSHPASS"
          umask 077
          known_hosts="$(mktemp)"
          trap 'rm -f "$known_hosts"' EXIT
          ssh-keyscan -T 10 -t ed25519 15.235.142.30 > "$known_hosts" 2>/dev/null
          actual="$(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}')"
          test "$actual" = "$HOST_FINGERPRINT" || { echo "SSH server identity changed"; exit 1; }
          archive_sha="$(sha256sum telecampaign-controls.tar.gz | awk '{print $1}')"
          remote_archive="/tmp/telecampaign-controls-${CONTROL_SHA}-${GITHUB_RUN_ID}.tar.gz"
          incoming="/tmp/telecampaign-runtime-${TARGET}-${GITHUB_RUN_ID}"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
            -o ConnectTimeout=15 ubuntu@15.235.142.30 "umask 077; mkdir -m 0700 '$incoming'"
          sshpass -e scp -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
            -o ConnectTimeout=15 telecampaign-controls.tar.gz "ubuntu@15.235.142.30:$remote_archive"
          sshpass -e scp -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
            -o ConnectTimeout=15 runtime/* "ubuntu@15.235.142.30:$incoming/"
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=6 \
            ubuntu@15.235.142.30 "bash -s -- '$TARGET' '$CONTROL_SHA' '$archive_sha' '$remote_archive' '$incoming'" <<'REMOTE'
          set -euo pipefail
          umask 077
          TARGET="$1"; CONTROL_SHA="$2"; ARCHIVE_SHA="$3"; ARCHIVE="$4"; INCOMING="$5"
          ROOT=/opt/telecampaign
          BACKUPS=/var/backups/telecampaign
          CONTROL="/var/lib/telecampaign/control/$CONTROL_SHA"
          STAGE="/var/lib/telecampaign/staging/$TARGET"
          test "$(hostname)" = "vps-cd243267"
          test "$(id -un)" = ubuntu
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ && "$CONTROL_SHA" =~ ^[0-9a-f]{40}$ && "$ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ARCHIVE" == /tmp/telecampaign-controls-"$CONTROL_SHA"-*.tar.gz ]]
          [[ "$INCOMING" == /tmp/telecampaign-runtime-"$TARGET"-* ]]
          test -d "$INCOMING"
          test ! -L "$INCOMING"
          (cd "$INCOMING" && sha256sum --status --check SHA256SUMS)
          test "$(cat "$INCOMING/COMMIT")" = "$TARGET"
          test "$(realpath "$ROOT")" = "$ROOT"
          test -d "$ROOT/.git"
          test -w "$BACKUPS"
          test -r /etc/telecampaign/api.env
          test "$(sha256sum "$ARCHIVE" | awk '{print $1}')" = "$ARCHIVE_SHA"
          available_mb="$(awk '/MemAvailable:/{print int($2/1024)}' /proc/meminfo)"
          echo "available_memory_mb=$available_mb"
          free_bytes="$(df --output=avail -B1 "$ROOT" | tail -1 | tr -d ' ')"
          if (( free_bytes < 2147483648 )); then
            echo "insufficient_disk_space_no_application_changes"
            exit 1
          fi
          # Never replace a lock inode: existing holders must remain effective.
          if test -L /var/lib/telecampaign/operation.lock; then echo "unsafe_lock_path"; exit 1; fi
          if ! test -e /var/lib/telecampaign/operation.lock; then
            sudo -n install -o ubuntu -g ubuntu -m 0600 /dev/null /var/lib/telecampaign/operation.lock
          fi
          test -w /var/lib/telecampaign/operation.lock
          test ! -L /var/lib/telecampaign/control
          test ! -L "$CONTROL"
          sudo -n install -d -o ubuntu -g ubuntu -m 0700 /var/lib/telecampaign/control "$CONTROL"
          test ! -L "$CONTROL"
          tar --extract --gzip --no-same-owner --file="$ARCHIVE" --directory="$CONTROL"
          rm -f "$ARCHIVE"
          test ! -L /var/lib/telecampaign/staging
          test ! -L "$STAGE"
          sudo -n install -d -o ubuntu -g ubuntu -m 0700 /var/lib/telecampaign/staging "$STAGE"
          cp -a "$INCOMING/." "$STAGE/"
          rm -rf -- "$INCOMING"
          # Preserve the one known generated mockup change. Abort for any other
          # local work rather than discarding it or stashing production config.
          changes="$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain --untracked-files=normal)"
          generated=artifacts/mockup-sandbox/src/.generated/mockup-components.ts
          if [[ -n "$changes" ]]; then
            if [[ "$changes" != " M $generated" ]]; then
              echo "unexpected_local_source_changes_no_deployment"
              exit 1
            fi
            preservation="$BACKUPS/bootstrap-$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -m 0700 "$preservation"
            git -c safe.directory="$ROOT" -C "$ROOT" diff --binary -- "$generated" > "$preservation/generated-mockup.patch"
            git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD > "$preservation/SOURCE_COMMIT"
            test -s "$preservation/generated-mockup.patch"
            git -c safe.directory="$ROOT" -C "$ROOT" checkout -- "$generated"
            echo "generated_mockup_change_preserved=$preservation"
          fi
          log="$BACKUPS/deploy-$(date -u +%Y%m%dT%H%M%SZ).log"
          # No install or build runs on VPS. Environment values are never
          # installed from the artifact or printed to public Actions logs.
          if nice -n 10 env TELECAMPAIGN_DEPLOY_BACKUP=0 bash "$CONTROL/scripts/deploy-telecampaign.sh" "$TARGET" \
            --prebuilt "$STAGE" >"$log" 2>&1; then
            echo "deployment_command=passed"
          else
            code=$?
            echo "deployment_command=failed"
            echo "private_diagnostic_log=$log"
            echo "automatic_rollback=disabled"
            exit "$code"
          fi
          verify_public_release() {
            test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = "$TARGET" || return 1
            bash "$ROOT/scripts/telecampaign-healthcheck.sh" >/dev/null 2>&1 || return 1
            local index="$ROOT/artifacts/telecampaign/dist/public/index.html" expected actual asset
            expected="$(sha256sum "$index" | awk '{print $1}')"
            actual="$(curl --fail --silent --show-error --max-time 20 \
              "https://tele.khaimmo.shop/?deploy=$TARGET" | sha256sum | awk '{print $1}')" || return 1
            test "$actual" = "$expected" || return 1
            asset="$(python3 -c 'import re,sys;s=open(sys.argv[1]).read();m=re.search(r"<script[^>]+src=\"(/assets/[A-Za-z0-9_.-]+\.js)\"",s);print(m.group(1) if m else "")' "$index")"
            [[ "$asset" =~ ^/assets/[A-Za-z0-9_.-]+\.js$ ]] || return 1
            expected="$(sha256sum "$ROOT/artifacts/telecampaign/dist/public$asset" | awk '{print $1}')"
            actual="$(curl --fail --silent --show-error --max-time 20 "https://tele.khaimmo.shop$asset" | sha256sum | awk '{print $1}')" || return 1
            test "$actual" = "$expected" || return 1
            grep -q 'Verify manually' "$ROOT/artifacts/telecampaign/dist/public$asset" || return 1
          }
          if ! verify_public_release >>"$log" 2>&1; then
            echo "public_release_check=failed"
            echo "automatic_rollback=disabled"
            exit 1
          fi
          echo "deployed_commit=$TARGET"
          echo "public_release_check=passed"
          echo "private_diagnostic_log=$log"
          echo "backup_and_automatic_rollback=disabled"
          # Refresh only the configured private admin's keyboard, never customer
          # chats. Credentials stay on VPS; failures are reported without values.
          if [[ -f "$ROOT/scripts/refresh-telecampaign-bot-menu.mjs" ]]; then
            if (
              set -a
              source /etc/telecampaign/api.env
              set +a
              node "$ROOT/scripts/refresh-telecampaign-bot-menu.mjs"
            ) >>"$log" 2>&1; then
              echo "license_lookup_database_check=passed"
              echo "admin_menu_refresh=passed"
            else
              bot_check_code=$?
              if [[ "$bot_check_code" -ne 3 ]]; then
                echo "license_lookup_database_check=failed"
                echo "automatic_rollback=disabled"
                exit 1
              fi
              echo "license_lookup_database_check=passed"
              echo "admin_menu_refresh=failed"
            fi
          fi
          REMOTE
