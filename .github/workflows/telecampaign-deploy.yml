name: TeleCamp isolated account deletion diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    services:
      test-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: telecamp_test
          POSTGRES_DB: telecamp_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telecamp_test -d telecamp_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - name: Fetch exact source
        run: |
          git init candidate
          cd candidate
          git remote add origin https://github.com/lyvankhai198-ops/Tele.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Restore dependency download cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.local/share/pnpm/store
          key: telecampaign-pnpm-${{ runner.os }}-${{ hashFiles('candidate/pnpm-lock.yaml') }}
          restore-keys: telecampaign-pnpm-${{ runner.os }}-
      - name: Run isolated integration only
        working-directory: candidate
        env:
          DATABASE_URL: postgres://telecamp_test@127.0.0.1:5432/telecamp_test
        run: |
          npx --yes pnpm@10.33.0 install --frozen-lockfile
          npx --yes pnpm@10.33.0 --filter @workspace/db run push-force
          node scripts/tests/run-admin-tools-e2e.mjs
