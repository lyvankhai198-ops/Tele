  /admin/user-support/campaign-targets:
    get:
      operationId: getAdminUserSupportCampaignTargets
      tags: [admin]
      parameters:
        - { name: userId, in: query, required: true, schema: { type: string } }
        - { name: campaignId, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: number, minimum: 1, maximum: 100, default: 100 } }
        - { name: offset, in: query, required: false, schema: { type: number, minimum: 0, default: 0 } }
      responses:
        "200":
          description: One bounded page of delivery targets for an owned campaign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserSupportCampaignTargets" }
        "400": { description: Invalid identifier or pagination query }
        "401": { description: Authentication is required }
        "403": { description: Administrator permission is required }
        "404": { description: User or campaign not found }
  /admin/users/{userId}/subscription:
    patch:
      operationId: updateAdminUserSubscription
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/AdminUserId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSubscriptionUpdateInput" }
      responses:
        "200":
          description: Subscription extended or upgraded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "400": { description: Invalid subscription change }
        "401": { description: Authentication is required }
        "403": { description: Administrator permission is required }
        "404": { description: User not found }
  /admin/users/{userId}/quota:
    patch:
      operationId: updateAdminUserQuota
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/AdminUserId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserQuotaUpdateInput" }
      responses:
        "200":
          description: User daily message quota exemption updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "400": { description: Invalid quota setting }
        "401": { description: Authentication is required }
        "403": { description: Administrator permission is required }
        "404": { description: User not found }
components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string }
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema: { type: string }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string }
    ProxyId:
      name: proxyId
      in: path
      required: true
      schema: { type: string }
    LicenseKeyId:
      name: licenseKeyId
      in: path
      required: true
      schema: { type: string }
    AdminUserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    AdminCampaignId:
      name: campaignId
      in: path
      required: true
      schema: { type: string }
    AdminNotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthUser:
      type: object
      required: [id, username, role]
      properties:
        id: { type: string }
        username: { type: string }
        role: { type: string, enum: [user, admin] }
    RegistrationInput:
      type: object
      required: [username, password, confirmPassword, captchaChallengeId, captchaCode]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        password: { type: string, minLength: 10, maxLength: 128 }
        confirmPassword: { type: string, minLength: 10, maxLength: 128 }
        captchaChallengeId: { type: string, minLength: 1, maxLength: 128 }
        captchaCode: { type: string, minLength: 1, maxLength: 32 }
    LoginInput:
      type: object
      required: [username, password, captchaChallengeId, captchaCode]
      properties:
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 1, maxLength: 128 }
        captchaChallengeId: { type: string, minLength: 1, maxLength: 128 }
        captchaCode: { type: string, minLength: 1, maxLength: 32 }
    AuthCaptcha:
      type: object
      required: [challengeId, image, expiresAt]
      properties:
        challengeId: { type: string, minLength: 1, maxLength: 128 }
        image: { type: string, minLength: 1 }
        expiresAt: { type: string, format: date-time }
    PasswordChangeInput:
      type: object
      required: [currentPassword, newPassword, confirmPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { type: string, minLength: 10, maxLength: 128 }
        confirmPassword: { type: string, minLength: 10, maxLength: 128 }
    RevokeSessionsResult:
      type: object
      required: [revokedCount]
      properties:
        revokedCount: { type: number }
    LegacyOwnerMappingInput:
      type: object
      required: [legacyOwnerId, targetUserId]
      properties:
        legacyOwnerId: { type: string, minLength: 1, maxLength: 200 }
        targetUserId: { type: string, minLength: 1, maxLength: 64 }
    LegacyOwnerMigrationResult:
      type: object
      required: [mappedRecords, remainingUnmappedOwners, restartRequired]
      properties:
        mappedRecords: { type: number }
        remainingUnmappedOwners: { type: number }
        restartRequired: { type: boolean }
    TelegramConfig:
      type: object
      required: [configured, missing, apiId]
      properties:
        configured: { type: boolean }
        missing:
          type: array
          items: { type: string }
        apiId: { type: ["number", "null"] }
    TelegramAccount:
      type: object
      required: [id, name, username, phone, api_id, telegramUserId, status, daily_limit, proxyId, lastSyncAt, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        username: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        api_id: { type: ["number", "null"] }
        telegramUserId: { type: ["string", "null"] }
        status: { type: string }
        daily_limit: { type: number }
        proxyId: { type: ["string", "null"] }
        lastSyncAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    TelegramAccountInput:
      type: object
      required: [api_id, api_hash, phone, daily_limit]
      properties:
        api_id: { type: number, minimum: 1 }
        api_hash: { type: string, minLength: 1, maxLength: 128 }
        phone: { type: string, minLength: 7, maxLength: 24 }
        daily_limit: { type: number, minimum: 1, maximum: 100000, default: 200 }
    TelegramAccountDeletion:
      type: object
      required: [message]
      properties:
        message: { type: string }
    TelegramLoginChallenge:
      type: object
      required: [id, expiresAt, delivery]
      properties:
        id: { type: string }
        expiresAt: { type: string, format: date-time }
        delivery: { type: string, enum: [app, sms] }
    TelegramLoginStart:
      type: object
      required: [account, challenge]
      properties:
        account: { $ref: "#/components/schemas/TelegramAccount" }
        challenge: { $ref: "#/components/schemas/TelegramLoginChallenge" }
    TelegramLoginCodeInput:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string, minLength: 1 }
        code: { type: string, minLength: 3, maxLength: 16 }
    TelegramLoginPasswordInput:
      type: object
      required: [challengeId, password]
      properties:
        challengeId: { type: string, minLength: 1 }
        password: { type: string, minLength: 1, maxLength: 256 }
    TelegramLoginResult:
      type: object
      required: [status, account]
      properties:
        status: { type: string, enum: [connected, requires_2fa] }
        account: { $ref: "#/components/schemas/TelegramAccount" }
    SyncResult:
      type: object
      required: [count]
      properties:
        count: { type: number }
    Destination:
      type: object
      required: [id, accountId, telegramId, topicId, parentTitle, title, username, kind, memberCount, canPost, permissionReason, permissionCheckedAt]
      properties:
        id: { type: string }
        accountId: { type: string }
        telegramId: { type: string }
        topicId: { type: ["number", "null"] }
        parentTitle: { type: ["string", "null"] }
        title: { type: string }
        username: { type: ["string", "null"] }
        kind: { type: string }
        memberCount: { type: ["number", "null"] }
        canPost: { type: boolean }
        permissionReason: { type: ["string", "null"] }
        permissionCheckedAt: { type: ["string", "null"], format: date-time }
    TelegramSavedMessage:
      type: object
      required: [id, text, date, hasMedia]
      properties:
        id: { type: string }
        text: { type: string }
        date: { type: ["string", "null"], format: date-time }
        hasMedia: { type: boolean }
    MessageTemplate:
      type: object
      required: [id, name, mode, content, sourceAccountId, sourceMessageId, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        mode: { type: string, enum: [text, forward] }
        content: { type: string }
        sourceAccountId: { type: ["string", "null"] }
        sourceMessageId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MessageTemplateInput:
      type: object
      required: [name, mode]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        mode: { type: string, enum: [text, forward] }
        content: { type: string, maxLength: 4096 }
        sourceAccountId: { type: ["string", "null"] }
        sourceMessageId: { type: ["string", "null"] }
    MessageTemplateUpdateInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        mode: { type: string, enum: [text, forward] }
        content: { type: string, maxLength: 4096 }
        sourceAccountId: { type: ["string", "null"] }
        sourceMessageId: { type: ["string", "null"] }
    Campaign:
      type: object
      required: [id, name, content, telegramAccountId, templateId, templateMode, templateSourceAccountId, templateSourceMessageId, clonedFromCampaignId, clonedFromUserId, cloneMode, mediaUrl, status, scheduledAt, timezone, maxRetries, repeatCount, roundDelayMinSeconds, roundDelayMaxSeconds, createdAt, targetCount, sentCount, failedCount, dailyQuota, destinationIds, errors]
      properties:
        id: { type: string }
        name: { type: string }
        content: { type: string }
        telegramAccountId: { type: ["string", "null"] }
        templateId: { type: ["string", "null"] }
        templateMode: { type: string, enum: [text, forward] }
        templateSourceAccountId: { type: ["string", "null"] }
        templateSourceMessageId: { type: ["string", "null"] }
        clonedFromCampaignId: { type: ["string", "null"] }
        clonedFromUserId: { type: ["string", "null"] }
        cloneMode: { type: ["string", "null"], enum: [admin, user, null] }
        mediaUrl: { type: ["string", "null"] }
        status: { type: string }
        scheduledAt: { type: ["string", "null"], format: date-time }
        timezone: { type: string }
        maxRetries: { type: number }
        repeatCount: { type: number }
        roundDelayMinSeconds: { type: number }
        roundDelayMaxSeconds: { type: number }
        createdAt: { type: string, format: date-time }
        targetCount: { type: number }
        sentCount: { type: number }
        failedCount: { type: number }
        dailyQuota: { $ref: "#/components/schemas/CampaignDailyQuota" }
        destinationIds:
          type: array
          items: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/CampaignTargetError" }
    CampaignDailyQuota:
      type: object
      required: [limit, used, remaining, sentToday, reservedToday]
      properties:
        limit: { type: ["number", "null"] }
        used: { type: number }
        remaining: { type: ["number", "null"] }
        sentToday: { type: number }
        reservedToday: { type: number }
    CampaignInput:
      type: object
      required: [name, destinationIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        content: { type: string, maxLength: 4096, default: "" }
        telegramAccountId: { type: ["string", "null"] }
        templateId: { type: ["string", "null"] }
        mediaUrl: { type: ["string", "null"] }
        destinationIds:
          type: array
          minItems: 1
          items: { type: string }
        scheduledAt: { type: ["string", "null"], format: date-time }
        timezone: { type: string, default: Asia/Ho_Chi_Minh }
        repeatCount: { type: number, minimum: 1, maximum: 300, default: 1 }
        roundDelayMinSeconds: { type: number, minimum: 0, maximum: 259200, default: 1 }
        roundDelayMaxSeconds: { type: number, minimum: 0, maximum: 259200, default: 3 }
    CloneCampaignInput:
      type: object
      required: [telegramAccountId]
      properties:
        telegramAccountId: { type: string }
    CampaignTargetError:
      type: object
      required: [destinationId, destinationTitle, status, attempts, lastError, nextAttemptAt]
      properties:
        destinationId: { type: string }
        destinationTitle: { type: string }
        status: { type: string }
        attempts: { type: number }
        lastError: { type: ["string", "null"] }
        nextAttemptAt: { type: ["string", "null"], format: date-time }
    CampaignUpdateInput:
      type: object
      properties:
        status: { type: string, enum: [draft, queued, paused, cancelled] }
        name: { type: string, minLength: 1, maxLength: 200 }
        telegramAccountId: { type: string }
        templateId: { type: string }
        destinationIds:
          type: array
          minItems: 1
          items: { type: string }
        scheduledAt: { type: ["string", "null"], format: date-time }
        timezone: { type: string }
        repeatCount: { type: number, minimum: 1, maximum: 300 }
        roundDelayMinSeconds: { type: number, minimum: 0, maximum: 259200 }
        roundDelayMaxSeconds: { type: number, minimum: 0, maximum: 259200 }
    AdminCampaignCloneInput:
      type: object
      required: [telegramAccountId]
      properties:
        telegramAccountId: { type: string }
    CampaignCloneDestinationReadiness:
      type: object
      required: [id, title, ready, reason]
      properties:
        id: { type: string }
        title: { type: string }
        ready: { type: boolean }
        reason: { type: ["string", "null"] }
    CampaignCloneReadiness:
      type: object
      required: [accountReady, messageReady, destinations]
      properties:
        accountReady: { type: boolean }
        messageReady: { type: boolean }
        destinations:
          type: array
          items: { $ref: "#/components/schemas/CampaignCloneDestinationReadiness" }
    CalendarItem:
      type: object
      required: [id, campaignId, name, scheduledAt, status, targetCount]
      properties:
        id: { type: string }
        campaignId: { type: string }
        name: { type: string }
        scheduledAt: { type: string, format: date-time }
        status: { type: string }
        targetCount: { type: number }
    ActivityLog:
      type: object
      required: [id, level, event, message, accountId, campaignId, targetId, metadata, createdAt, campaignName, accountName, destinationTitle, destinationUsername, targetStatus, targetAttempts, targetLastError, targetNextAttemptAt]
      properties:
        id: { type: string }
        level: { type: string }
        event: { type: string }
        message: { type: string }
        accountId: { type: ["string", "null"] }
        campaignId: { type: ["string", "null"] }
        targetId: { type: ["string", "null"] }
        metadata: { type: ["object", "null"], additionalProperties: true }
        createdAt: { type: string, format: date-time }
        campaignName: { type: ["string", "null"] }
        accountName: { type: ["string", "null"] }
        destinationTitle: { type: ["string", "null"] }
        destinationUsername: { type: ["string", "null"] }
        targetStatus: { type: ["string", "null"] }
        targetAttempts: { type: ["number", "null"] }
        targetLastError: { type: ["string", "null"] }
        targetNextAttemptAt: { type: ["string", "null"], format: date-time }
    ProxyAccount:
      type: object
      required: [id, name, phone]
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: ["string", "null"] }
    Proxy:
      type: object
      required: [id, name, type, host, port, hasAuth, status, accountCount, accounts, lastCheckedAt, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
