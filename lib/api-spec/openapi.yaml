      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCampaignCloneInput" }
      responses:
        "201":
          description: A draft campaign owned by the administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "400": { description: Invalid clone request }
        "401": { description: Authentication is required }
        "403": { description: Administrator permission is required }
        "404": { description: "User, campaign, or Telegram account not found" }
