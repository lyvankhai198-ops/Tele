        "401": { description: Authentication is required }
        "403": { description: Administrator permission is required }
  /admin/users/{userId}:
    get:
      operationId: getAdminUser
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/AdminUserId" }
      responses:
        "200":
          description: User details for administrator support
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { description: Authentication is required }
        "403": { description: Administrator permission is required }
        "404": { description: User not found }
  /admin/users/{userId}/support:
    get:
      operationId: getAdminUserSupport
