openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
  - name: telegram
  - name: destinations
  - name: campaigns
  - name: activity
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: registerAuth
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationInput" }
      responses:
        "201":
          description: Registered and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "400": { description: Invalid registration data }
        "409": { description: Username already exists }
        "429": { description: Too many attempts }
        "503": { description: Registration is disabled or workspace is in maintenance mode }
  /auth/login:
    post:
      operationId: loginAuth
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "400": { description: Invalid login data }
        "401": { description: Invalid credentials }
        "429": { description: Too many attempts }
  /auth/captcha:
    get:
      operationId: getAuthCaptcha
      tags: [auth]
      summary: Issue a CAPTCHA challenge for authentication
      responses:
        "200":
          description: CAPTCHA challenge
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthCaptcha" }
        "429": { description: Too many CAPTCHA requests }
  /auth/logout:
    post:
      operationId: logoutAuth
      tags: [auth]
      responses:
        "204": { description: Signed out }
  /auth/change-password:
    post:
      operationId: changeAuthPassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChangeInput" }
      responses:
        "204": { description: Password changed }
        "400": { description: Invalid password data }
        "401": { description: Authentication is required or current password is invalid }
        "429": { description: Too many password-change attempts }
  /auth/revoke-other-sessions:
    post:
      operationId: revokeOtherAuthSessions
      tags: [auth]
      responses:
        "200":
          description: Other sessions revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokeSessionsResult" }
        "401": { description: Authentication is required }
  /auth/me:
    get:
      operationId: getAuthUser
      tags: [auth]
      responses:
        "200":
          description: Current authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "401": { description: Authentication is required }
  /auth/legacy-owner-mappings:
    post:
      operationId: migrateLegacyAuthOwner
      tags: [auth]
      parameters:
        - name: X-Auth-Migration-Token
          in: header
          required: true
          schema: { type: string, minLength: 32, maxLength: 512 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegacyOwnerMappingInput" }
      responses:
        "200":
          description: Legacy owner mapped safely
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyOwnerMigrationResult" }
        "401": { description: Authentication is required }
        "403": { description: Migration authorization failed }
        "404": { description: Legacy owner or target user not found }
        "503": { description: Migration token is not configured }
  /telegram/config:
    get:
      operationId: getTelegramConfig
      tags: [telegram]
      responses:
        "200":
          description: Telegram configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramConfig"
  /telegram/accounts:
    get:
      operationId: listTelegramAccounts
      tags: [telegram]
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TelegramAccount" }
    post:
      operationId: createTelegramAccount
      tags: [telegram]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelegramAccountInput" }
      responses:
        "201":
          description: Telegram account saved and verification code sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelegramLoginStart" }
        "403":
          description: Telegram account quota exceeded
  /telegram/accounts/{accountId}:
    delete:
      operationId: deleteTelegramAccount
      tags: [telegram]
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "200":
          description: Telegram account deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelegramAccountDeletion" }
  /telegram/accounts/{accountId}/sync:
    post:
      operationId: syncTelegramDestinations
      tags: [telegram]
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "202":
          description: Sync accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncResult" }
  /telegram/accounts/{accountId}/login:
    post:
      operationId: startTelegramLogin
      tags: [telegram]
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "201":
          description: Telegram verification code sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelegramLoginStart" }
        "409": { description: Account is not ready for a new login attempt }
  /telegram/accounts/{accountId}/login/code:
    post:
      operationId: confirmTelegramLoginCode
      tags: [telegram]
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelegramLoginCodeInput" }
      responses:
        "200":
          description: Telegram code processed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelegramLoginResult" }
        "409": { description: "Challenge is invalid, expired, or no longer active" }
  /telegram/accounts/{accountId}/login/password:
    post:
      operationId: confirmTelegramLoginPassword
      tags: [telegram]
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelegramLoginPasswordInput" }
      responses:
        "200":
          description: Telegram 2FA password processed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelegramLoginResult" }
        "409": { description: "Challenge is invalid, expired, or no longer active" }
  /destinations:
    get:
      operationId: listDestinations
      tags: [destinations]
      responses:
        "200":
          description: Destinations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Destination" }
  /telegram/accounts/{accountId}/saved-messages:
    get:
      operationId: listTelegramSavedMessages
      tags: [telegram]
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "200":
          description: Recent messages from the account's Saved Messages chat
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TelegramSavedMessage" }
        "404": { description: Telegram account not found }
        "409": { description: Telegram account is not connected }
  /telegram/accounts/{accountId}/saved-messages/{messageId}:
    get:
      operationId: getTelegramSavedMessage
      tags: [telegram]
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - name: messageId
          in: path
          required: true
          schema: { type: string, pattern: "^[1-9][0-9]*$" }
      responses:
        "200":
          description: Current saved message content from Telegram
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelegramSavedMessage" }
        "404": { description: Telegram account or saved message not found }
        "409": { description: Telegram account is not connected or Telegram could not be reached }
  /proxies:
    get:
      operationId: listProxies
      tags: [proxy]
      responses:
        "200":
          description: Proxies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Proxy" }
    post:
      operationId: createProxy
      tags: [proxy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProxyInput" }
      responses:
        "201":
          description: Proxy created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proxy" }
  /proxies/{proxyId}:
    patch:
      operationId: updateProxy
      tags: [proxy]
      parameters:
        - { $ref: "#/components/parameters/ProxyId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProxyInput" }
      responses:
        "200":
          description: Proxy updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proxy" }
    delete:
      operationId: deleteProxy
      tags: [proxy]
      parameters:
        - { $ref: "#/components/parameters/ProxyId" }
      responses:
        "204": { description: Proxy deleted }
  /proxies/{proxyId}/test:
    post:
      operationId: testProxy
      tags: [proxy]
      parameters:
        - { $ref: "#/components/parameters/ProxyId" }
      responses:
        "200":
          description: Proxy connectivity test result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxyTestResponse" }
        "404": { description: Proxy not found }
  /proxies/{proxyId}/accounts/{accountId}:
    post:
      operationId: attachProxyAccount
      tags: [proxy]
      parameters:
        - { $ref: "#/components/parameters/ProxyId" }
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "204": { description: Proxy attached }
    delete:
      operationId: detachProxyAccount
      tags: [proxy]
      parameters:
        - { $ref: "#/components/parameters/ProxyId" }
        - { $ref: "#/components/parameters/AccountId" }
      responses:
        "204": { description: Proxy detached }
  /message-templates:
    get:
      operationId: listMessageTemplates
      tags: [templates]
      responses:
        "200":
          description: Message templates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MessageTemplate" }
    post:
      operationId: createMessageTemplate
      tags: [templates]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageTemplateInput" }
      responses:
        "201":
          description: Message template created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageTemplate" }
        "400": { description: Invalid template input }
        "404": { description: Source Telegram account not found }
        "409": { description: Source account is not connected }
  /message-templates/{templateId}:
    patch:
      operationId: updateMessageTemplate
      tags: [templates]
      parameters:
        - { $ref: "#/components/parameters/TemplateId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageTemplateUpdateInput" }
      responses:
        "200":
          description: Message template updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageTemplate" }
        "400": { description: Invalid template input }
        "404": { description: Message template or source account not found }
        "409": { description: Source account is not connected }
    delete:
      operationId: deleteMessageTemplate
      tags: [templates]
      parameters:
        - { $ref: "#/components/parameters/TemplateId" }
      responses:
        "204": { description: Message template deleted }
        "404": { description: Message template not found }
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      responses:
        "200":
          description: Campaigns
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Campaign" }
    post:
      operationId: createCampaign
      tags: [campaigns]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignInput" }
      responses:
        "201":
          description: Campaign created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
  /campaigns/{campaignId}:
    patch:
      operationId: updateCampaignStatus
      tags: [campaigns]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignUpdateInput" }
      responses:
        "200":
          description: Updated campaign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      responses:
        "204": { description: Deleted }
  /campaigns/{campaignId}/clone:
    post:
      operationId: cloneCampaign
      tags: [campaigns]
      parameters:
        - { $ref: "#/components/parameters/CampaignId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloneCampaignInput" }
      responses:
        "201":
          description: Campaign cloned into a draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "400": { description: Invalid clone input }
        "404": { description: Campaign or Telegram account not found }
        "409": { description: Campaign limit reached or Telegram account is not connected }
  /calendar:
    get:
      operationId: listCalendarItems
      tags: [campaigns]
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Scheduled items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CalendarItem" }
  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        "200":
          description: Activity log
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityLog" }
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      responses:
        "200":
          description: Dashboard summary for the authenticated workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
        "401": { description: Authentication is required }
        "503": { description: Ownership migration is pending }
  /account:
    get:
      operationId: getAccountSummary
      tags: [account]
      responses:
        "200":
          description: Authenticated account profile, subscription, and usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountSummary" }
        "401": { description: Authentication is required }
        "503": { description: Ownership migration is pending }
  /system-defaults:
    get:
      operationId: getSystemDefaults
      tags: [settings]
      responses:
        "200":
          description: Operational defaults used by new accounts and campaigns
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemDefaults" }
        "401": { description: Authentication is required }
        "503": { description: Ownership migration is pending }
  /support:
    get:
      operationId: getSupportSettings
      tags: [settings]
      responses:
        "200":
          description: Configured support channels for the current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportSettingsResponse" }
        "401": { description: Authentication is required }
  /group-library/access:
    get:
      operationId: getGroupLibraryAccess
      tags: [settings]
      responses:
        "200":
          description: Current user's access to the shared group library
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupLibraryAccess" }
        "401": { description: Authentication is required }
  /group-library:
    get:
      operationId: getGroupLibrary
      tags: [destinations]
      responses:
        "200":
          description: Persisted Telegram groups visible to the current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminActiveGroupDirectory" }
        "401": { description: Authentication is required }
        "403": { description: Group library is not visible to users }
        "503": { description: Ownership migration is pending }
  /upgrade:
    get:
      operationId: getUpgradeSummary
      tags: [upgrade]
      responses:
        "200":
          description: Available plans and current subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpgradeSummary" }
        "401": { description: Authentication is required }
        "503": { description: Ownership migration is pending }
  /admin/purchase-settings:
    get:
      operationId: getAdminPurchaseSettings
      tags: [admin]
      responses:
        "200":
          description: Admin-configured purchase links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseSettings" }
        "401": { description: Authentication is required }
        "403": { description: Administrator permission is required }
    patch:
      operationId: updateAdminPurchaseSettings
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchaseSettingsInput" }
      responses:
        "200":
          description: Purchase links updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseSettings" }
        "400": { description: Invalid Telegram purchase link }
        "401": { description: Authentication is required }
        "403": { description: Administrator permission is required }
  /admin/system-settings:
    get:
      operationId: getAdminSystemSettings
      tags: [admin]
      responses:
        "200":
          description: System settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSystemSettings" }
        "401": { description: Authentication is required }
        "403": { description: Administrator permission is required }
    patch:
      operationId: updateAdminSystemSettings
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSystemSettingsInput" }
      responses:
        "200":
          description: System settings updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSystemSettings" }
        "400": { description: Invalid system settings }
        "401": { description: Authentication is required }
        "403": { description: Administrator permission is required }
  /admin/operations:
    get:
      operationId: getAdminOperations
      tags: [admin]
      responses:
        "200":
          description: Operational monitoring data for administrators
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOperations" }
        "401": { description: Authentication is required }
        "403": { description: Administrator permission is required }
  /admin/campaigns/{campaignId}:
    patch:
      operationId: updateAdminCampaignStatus
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/AdminCampaignId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCampaignStatusInput" }
      responses:
        "200":
          description: Campaign status updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOperationCampaign" }
        "400": { description: Invalid status }
        "404": { description: Campaign not found }
  /admin/users/{userId}/campaigns/{campaignId}:
    patch:
      operationId: updateAdminUserCampaignStatus
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/AdminUserId" }
        - { $ref: "#/components/parameters/AdminCampaignId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCampaignStatusInput" }
      responses:
        "200":
          description: Customer campaign status updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOperationCampaign" }
        "400": { description: Invalid status or identifier }
        "403": { description: Administrator permission is required }
        "404": { description: User or campaign not found }
        "409": { description: Campaign is not ready for the requested status }
  /admin/targets/{targetId}/retry:
    post:
      operationId: retryAdminCampaignTarget
      tags: [admin]
      parameters:
        - { name: targetId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Campaign target requeued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOperationTarget" }
        "404": { description: Target not found }
  /admin/users/{userId}/targets/{targetId}/retry:
    post:
      operationId: retryAdminUserSupportCampaignTarget
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/AdminUserId" }
        - { name: targetId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Customer campaign target requeued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOperationTarget" }
        "400": { description: Invalid identifier }
        "403": { description: Administrator permission is required }
        "404": { description: User or target not found }
        "409": { description: Target is not eligible for retry }
  /upgrade/activate:
    post:
      operationId: activateLicense
      tags: [upgrade]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivateLicenseInput" }
      responses:
        "200":
          description: License activated and subscription updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseActivationResult" }
        "400": { description: Invalid license key input }
        "401": { description: Authentication is required }
        "409": { description: "License is invalid, already used, or cannot downgrade" }
        "503": { description: Ownership migration is pending }
  /admin/license-keys:
    get:
      operationId: listAdminLicenseKeys
      tags: [admin]
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/LicenseKeyStatus" } }
        - { name: plan, in: query, required: false, schema: { $ref: "#/components/schemas/PlanCode" } }
      responses:
        "200":
          description: License key inventory
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminLicenseKey" }
        "401": { description: Authentication is required }
        "403": { description: Administrator permission is required }
    post:
      operationId: createAdminLicenseKey
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAdminLicenseKeyInput" }
      responses:
        "201":
          description: License key created; plaintext key is returned only in this response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateAdminLicenseKeyResult" }
        "400": { description: Invalid key parameters }
        "401": { description: Authentication is required }
        "403": { description: Administrator permission is required }
  /admin/license-keys/{licenseKeyId}/revoke:
    post:
      operationId: revokeAdminLicenseKey
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/LicenseKeyId" }
      responses:
        "204": { description: Unused license key revoked }
        "401": { description: Authentication is required }
        "403": { description: Administrator permission is required }
        "404": { description: License key not found }
        "409": { description: License key is already claimed or revoked }
  /admin/license-keys/{licenseKeyId}/secret:
    get:
      operationId: getAdminLicenseKeySecret
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/LicenseKeyId" }
      responses:
        "200":
          description: Plaintext license key for an authenticated administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLicenseKeySecret" }
        "401": { description: Authentication is required }
