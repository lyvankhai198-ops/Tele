  /admin/notifications/upload-url:
    post:
      operationId: requestAdminNotificationUploadUrl
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminNotificationUploadInput" }
      responses:
        "200":
          description: Short-lived authenticated URL for direct TeleCampaign media upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminNotificationUpload" }
        "400": { description: Invalid or unsupported media }
        "401": { description: Authentication is required }
        "403": { description: Administrator permission is required }
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      parameters:
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 64 } }
        - { name: plan, in: query, required: false, schema: { $ref: "#/components/schemas/PlanCode" } }
      responses:
        "200":
          description: Users with subscription and resource usage summaries
          content:
            application/json:
              schema:
