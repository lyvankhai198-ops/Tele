    AdminUserSupport:
      type: object
      required: [user, overview, telegramAccounts, campaigns, campaignsTruncated, recentErrors, activity]
      properties:
        user: { $ref: "#/components/schemas/AdminUser" }
        overview: { $ref: "#/components/schemas/AdminUserSupportOverview" }
        telegramAccounts:
          type: array
          items: { $ref: "#/components/schemas/AdminUserSupportAccount" }
        campaigns:
          type: array
          items: { $ref: "#/components/schemas/AdminUserSupportCampaign" }
        campaignsTruncated: { type: boolean }
        recentErrors:
          type: array
          items: { $ref: "#/components/schemas/AdminUserSupportTarget" }
        activity:
          type: array
          items: { $ref: "#/components/schemas/AdminUserSupportActivity" }
    AdminGroupRoundDelay:
      type: object
      required: [minSeconds, maxSeconds, sentCount, errorCount, sampleCount, errorRate, isPreferred]
      properties:
        minSeconds: { type: number }
        maxSeconds: { type: number }
        sentCount: { type: number }
        errorCount: { type: number }
        sampleCount: { type: number }
        errorRate: { type: ["number", "null"], minimum: 0, maximum: 1 }
        isPreferred: { type: boolean }
    GroupLibraryAccountMembership:
      type: object
      required: [accountId, destinationId, canPost]
      properties:
        accountId: { type: string }
        destinationId: { type: string }
        canPost: { type: boolean }
    AdminActiveGroup:
      type: object
      required: [id, title, username, telegramLink, kind, memberCount, isPublished, roundDelays]
      properties:
        id: { type: string }
        title: { type: string }
        username: { type: ["string", "null"] }
        telegramLink: { type: ["string", "null"] }
        kind: { type: string }
        memberCount: { type: ["number", "null"] }
        isPublished: { type: boolean }
        roundDelays:
          type: array
          items: { $ref: "#/components/schemas/AdminGroupRoundDelay" }
        accountMemberships:
          type: array
          items: { $ref: "#/components/schemas/GroupLibraryAccountMembership" }
    AdminActiveGroupDirectory:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items: { $ref: "#/components/schemas/AdminActiveGroup" }
    AdminGroupLibrarySyncResult:
      type: object
      required: [addedCount, candidateCount]
      properties:
        addedCount: { type: number }
        candidateCount: { type: number }
    AdminGroupLibraryImportResult:
      type: object
      required: [imported]
      properties:
        imported: { type: boolean }
    AdminSubscriptionUpdateInput:
      type: object
      required: [plan, durationDays]
      properties:
        plan: { $ref: "#/components/schemas/PlanCode" }
        durationDays: { type: number, minimum: 1, maximum: 3660 }
    AdminUserQuotaUpdateInput:
      type: object
      required: [dailyQuotaExemptFrom, dailyQuotaExemptUntil]
      properties:
        dailyQuotaExemptFrom: { type: ["string", "null"], pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        dailyQuotaExemptUntil: { type: ["string", "null"], pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
    UsageMetric:
      type: object
      required: [used, limit, remaining, percentage]
      properties:
        used: { type: number }
        limit: { type: ["number", "null"] }
        remaining: { type: ["number", "null"] }
        percentage: { type: number }
    AccountProfile:
      type: object
      required: [username, joinedAt, email]
      properties:
        username: { type: string }
        joinedAt: { type: string, format: date-time }
        email: { type: ["string", "null"] }
    AccountUsage:
      type: object
      required: [telegramAccounts, campaigns, messagesToday]
      properties:
        telegramAccounts: { $ref: "#/components/schemas/UsageMetric" }
        campaigns: { $ref: "#/components/schemas/UsageMetric" }
        messagesToday: { $ref: "#/components/schemas/UsageMetric" }
    AccountSummary:
      type: object
      required: [profile, subscription, usage]
      properties:
        profile: { $ref: "#/components/schemas/AccountProfile" }
        subscription: { $ref: "#/components/schemas/Subscription" }
        usage: { $ref: "#/components/schemas/AccountUsage" }

